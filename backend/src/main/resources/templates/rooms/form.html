<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${room.id} != null ? 'Edit Room Allotment' : 'Add Room Allotment'"></title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    /* 🌙 Dark Glassmorphic Theme */
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #0d1117, #0a0c10 70%);
      color: #e6edf3;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      backdrop-filter: blur(10px);
    }

    .main-content {
      margin-left: 260px;
      padding: 40px;
      transition: margin-left 0.3s ease;
      min-height: 100vh;
    }

    .sidebar.active + .main-content {
      margin-left: 0;
    }

    /* 🩺 Form Container */
    .form-container {
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(88, 166, 255, 0.08);
      max-width: 950px;
      margin: 0 auto;
      padding: 40px;
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .form-container:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(88, 166, 255, 0.15);
    }

    h2 {
      color: #58a6ff;
      font-weight: 700;
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(88, 166, 255, 0.3);
    }

    /* 🧩 Inputs & Selects */
    .form-control, .form-select {
      background-color: #161b22 !important; /* ✅ lighter dark background */
      border: 1px solid #30363d;
      color: #ffffff !important; /* ✅ pure white text */
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.3);
    }

    .form-control::placeholder,
    .form-select option {
      color: #a5b1c2;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #58a6ff;
      background-color: #1c2128 !important;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.5);
      transform: scale(1.01);
    }

    label {
      font-weight: 500;
      color: #c9d1d9;
    }

    /* 🧠 Buttons */
    .btn {
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-success {
      background: linear-gradient(145deg, #2ea043, #238636);
      border: none;
      color: #fff;
      box-shadow: 0 4px 10px rgba(46, 160, 67, 0.3);
    }

    .btn-success:hover {
      background: linear-gradient(145deg, #3fb950, #2ea043);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(63, 185, 80, 0.4);
    }

    .btn-secondary {
      background-color: #30363d;
      border: none;
      color: #fff;
    }

    .btn-secondary:hover {
      background-color: #484f58;
      transform: translateY(-2px);
    }

    .btn-outline-light {
      border-color: #444c56;
      color: #e6edf3;
    }

    .btn-outline-light:hover {
      background-color: #30363d;
      color: #fff;
    }

    /* 🔘 Sidebar Toggle */
    .toggle-btn {
      background: none;
      border: none;
      color: #58a6ff;
      font-size: 1.8rem;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .toggle-btn:hover {
      color: #1f6feb;
    }

    /* 📱 Responsive */
    @media (max-width: 768px) {
      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .form-container {
        padding: 25px;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- Main -->
  <main class="main-content">
    <div class="d-flex align-items-center mb-4">
      <button class="toggle-btn d-md-none me-3" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>
      <a th:href="@{/rooms}" class="btn btn-outline-light btn-sm me-3">
        <i class="bi bi-arrow-left"></i> Back
      </a>
      <h2 th:text="${room.id} != null ? 'Edit Room Allotment' : 'Add Room Allotment'"></h2>
    </div>

    <div class="form-container">
      <form th:action="${room.id} != null ? @{/rooms/update/{id}(id=${room.id})} : @{/rooms}"
            method="post" class="row g-4">

        <div class="col-md-4">
          <label class="form-label">Room Number</label>
          <input type="text" class="form-control" name="roomNumber" th:value="${room.roomNumber}" required />
        </div>

        <div class="col-md-4">
          <label class="form-label">Patient Name</label>
          <input type="text" class="form-control" name="patientName" th:value="${room.patientName}" required />
        </div>

        <div class="col-md-4">
          <label class="form-label">Room Type</label>
          <select class="form-select" name="roomType" required>
            <option value="General" th:selected="${room.roomType == 'General'}">General</option>
            <option value="Private" th:selected="${room.roomType == 'Private'}">Private</option>
            <option value="ICU" th:selected="${room.roomType == 'ICU'}">ICU</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Doctor In Charge</label>
          <input type="text" class="form-control" name="doctorInCharge" th:value="${room.doctorInCharge}" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Admission Date</label>
          <input type="date" class="form-control" name="admissionDate" th:value="${room.admissionDate}" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Discharge Date</label>
          <input type="date" class="form-control" name="dischargeDate" th:value="${room.dischargeDate}" />
        </div>

        <div class="col-md-4">
          <label class="form-label">Status</label>
          <select class="form-select" name="status" required>
            <option value="Occupied" th:selected="${room.status == 'Occupied'}">Occupied</option>
            <option value="Available" th:selected="${room.status == 'Available'}">Available</option>
            <option value="Cleaning" th:selected="${room.status == 'Cleaning'}">Cleaning</option>
          </select>
        </div>

        <div class="col-12 d-flex justify-content-between pt-4">
          <a th:href="@{/rooms}" class="btn btn-secondary">
            <i class="bi bi-x-circle me-1"></i> Cancel
          </a>
          <button type="submit" class="btn btn-success">
            <i class="bi bi-check-circle me-1"></i> Save
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      sidebar.classList.toggle('active');
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
