<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏥 HMS | Room Allotments</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>

  <!-- Sidebar -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>

  <style>
    /* ===============================
       🌙 DARK THEME VARIABLES
    =============================== */
    :root {
      --bg-main: #0d1117;
      --bg-card: #1c1f26;
      --border-color: #2f333a;
      --text-primary: #e6edf3;
      --text-secondary: #9aa1aa;
      --accent-teal: #00c2d1;
      --accent-green: #2ea043;
      --accent-red: #f85149;
      --accent-yellow: #f0ad4e;
      --shadow-soft: rgba(0, 194, 209, 0.15);
      --shadow-strong: rgba(0, 194, 209, 0.4);
      --hover-dark: #20252d;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      margin: 0;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ===============================
       📦 MAIN CONTENT
    =============================== */
    .main-content {
      margin-left: 260px;
      padding: 40px;
      background-color: var(--bg-main);
      min-height: 100vh;
      transition: margin-left 0.3s ease;
    }

    h1 {
      color: var(--accent-teal);
      font-weight: 700;
      font-size: 1.9rem;
      text-shadow: 0 0 10px rgba(0, 194, 209, 0.4);
    }

    /* ===============================
       🧾 TABLE CARD
    =============================== */
    .table-responsive {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 0 15px var(--shadow-soft);
      transition: all 0.3s ease;
    }

    .table-responsive:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px var(--shadow-strong);
    }

    .table {
      color: var(--text-primary);
      border-color: var(--border-color);
      margin-bottom: 0;
    }

    .table thead {
      background-color: #151a20;
      border-bottom: 2px solid var(--accent-teal);
    }

    .table thead th {
      color: var(--accent-teal);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.9rem;
      border-color: var(--border-color);
    }

    .table tbody tr {
      transition: all 0.25s ease;
    }

    .table tbody tr:hover {
      background-color: var(--hover-dark);
      transform: scale(1.01);
      box-shadow: inset 0 0 10px rgba(0, 194, 209, 0.2);
    }

    .table td {
      vertical-align: middle;
      border-color: var(--border-color);
      color: var(--text-secondary);
    }

    /* ===============================
       🎨 BADGES
    =============================== */
    .badge {
      font-weight: 600;
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 8px;
      text-transform: capitalize;
      transition: all 0.25s ease;
    }

    .badge:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
    }

    .bg-danger { background-color: var(--accent-red) !important; }
    .bg-info { background-color: var(--accent-teal) !important; }
    .bg-success { background-color: var(--accent-green) !important; }
    .bg-warning { background-color: var(--accent-yellow) !important; color: #111 !important; }

    /* ===============================
       🔘 BUTTONS
    =============================== */
    .btn {
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.25);
    }

    .btn-success {
      background-color: var(--accent-teal);
      border: none;
      color: #fff;
    }

    .btn-success:hover {
      background-color: #00a0af;
      transform: translateY(-2px);
      box-shadow: 0 0 15px var(--shadow-strong);
    }

    .btn-warning {
      background-color: var(--accent-yellow);
      border: none;
      color: #111;
    }

    .btn-warning:hover {
      background-color: #f7b733;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(240, 173, 78, 0.5);
    }

    .btn-danger {
      background-color: var(--accent-red);
      border: none;
    }

    .btn-danger:hover {
      background-color: #d03e38;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(248, 81, 73, 0.5);
    }

    /* ===============================
       ⚙️ TOGGLE & MOBILE
    =============================== */
    .toggle-btn {
      background: transparent;
      border: none;
    }

    @media (max-width: 768px) {
      .main-content {
        margin-left: 0;
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <!-- ✅ Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- ✅ Main Content -->
  <main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center">
        <button class="toggle-btn d-md-none me-3" onclick="toggleSidebar()">
          <i class="bi bi-list text-light fs-3"></i>
        </button>
        <h1><i class="bi bi-door-open me-2"></i> Room Allotments</h1>
      </div>
      <a th:href="@{/rooms/new}" class="btn btn-success shadow-sm">
        <i class="bi bi-plus-circle me-2"></i> Allot New Room
      </a>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Room No.</th>
            <th>Patient</th>
            <th>Room Type</th>
            <th>Doctor</th>
            <th>Admission</th>
            <th>Discharge</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="room : ${rooms}">
            <td th:text="${room.id}"></td>
            <td th:text="${room.roomNumber}"></td>
            <td th:text="${room.patientName}"></td>
            <td>
              <span class="badge"
                    th:text="${room.roomType}"
                    th:classappend="${room.roomType == 'ICU'} ? 'bg-danger' :
                                   (${room.roomType == 'Private'} ? 'bg-info' : 'bg-secondary')"></span>
            </td>
            <td th:text="${room.doctorInCharge}"></td>
            <td th:text="${room.admissionDate}"></td>
            <td th:text="${room.dischargeDate}"></td>
            <td>
              <span class="badge"
                    th:text="${room.status}"
                    th:classappend="${room.status == 'Occupied'} ? 'bg-warning text-dark' :
                                   (${room.status == 'Available'} ? 'bg-success' : 'bg-secondary')"></span>
            </td>
            <td class="text-center">
              <a th:href="@{/rooms/edit/{id}(id=${room.id})}" class="btn btn-warning btn-sm me-1" title="Edit">
                <i class="bi bi-pencil"></i>
              </a>
              <a th:href="@{/rooms/delete/{id}(id=${room.id})}"
                 class="btn btn-danger btn-sm"
                 onclick="return confirm('Are you sure you want to delete this allotment?')"
                 title="Delete">
                 <i class="bi bi-trash"></i>
              </a>
            </td>
          </tr>

          <!-- If no data -->
          <tr th:if="${#lists.isEmpty(rooms)}">
            <td colspan="9" class="text-center py-4 text-secondary">
              No room allotments found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      sidebar.classList.toggle('active');
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
