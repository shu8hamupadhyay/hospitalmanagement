<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Death Report</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />

  <style>
    :root { --bg-main:#0d1117; --bg-sidebar:#161b22; --bg-card:#1c2128; --border-color:#30363d; --text-primary:#e6edf3; --text-secondary:#8b949e; --accent-blue:#58a6ff; --accent-green:#3fb950; --hover-green:#238636; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-primary); display:flex; height:100vh; overflow:hidden; }
    .nav-link { color:var(--text-primary); display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:8px; font-weight:500; transition:all .25s ease; }
    .main-content { flex-grow:1; overflow-y:auto; padding:40px; }
    .card { background-color: var(--bg-card); border:1px solid var(--border-color); border-radius:14px; padding:30px; color:var(--text-primary); }
    label { font-weight:500; color:var(--text-secondary); }
    input, select, textarea { background-color:#161b22; border:1px solid var(--border-color); color:var(--text-primary); border-radius:8px; padding:8px 10px; width:100%; }
    input:focus, select:focus, textarea:focus { border-color:var(--accent-blue); box-shadow:0 0 5px var(--accent-blue); outline:none; }
    button { background-color:var(--hover-green); border:none; color:#fff; padding:10px 18px; border-radius:8px; font-weight:600; transition:background-color .3s ease; }
    button:hover { background-color:var(--accent-green); }
    a { color:var(--accent-blue); text-decoration:none; }
    @media (max-width:768px) { .sidebar{display:none;} body{flex-direction:column;} .main-content{padding:20px;} }
  </style>
</head>

<body>
  

      <!-- Sidebar Toggle Button -->
  <button class="toggle-btn" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <!-- Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>



  <main class="main-content">
    <h2 class="fw-bold mb-4" style="color:var(--accent-blue)">Add Death Report</h2>

    <div class="card">
      <form th:action="@{/death-reports/add}" th:object="${report}" method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label>Patient Name</label>
            <input type="text" th:field="*{patientName}" placeholder="Patient full name" required />
          </div>

          <div class="col-md-3">
            <label>Gender</label>
            <select th:field="*{gender}">
              <option value="" th:if="${report.gender == null}" disabled selected>Select</option>
              <option value="Male" th:selected="${report.gender == 'Male'}">Male</option>
              <option value="Female" th:selected="${report.gender == 'Female'}">Female</option>
              <option value="Other" th:selected="${report.gender == 'Other'}">Other</option>
            </select>
          </div>

          <div class="col-md-3">
            <label>Ward</label>
            <input type="text" th:field="*{ward}" placeholder="Ward / room" />
          </div>

          <div class="col-md-6">
            <label>Cause of Death</label>
            <input type="text" th:field="*{causeOfDeath}" placeholder="Cause of death" required />
          </div>

          <div class="col-md-6">
            <label>Doctor Name</label>
            <input type="text" th:field="*{doctorName}" placeholder="Attending doctor" required />
          </div>

          <div class="col-md-6">
            <label>Date & Time of Death</label>
            <input type="datetime-local" th:field="*{dateOfDeath}" />
          </div>

          <div class="col-12">
            <label>Remarks</label>
            <textarea th:field="*{remarks}" rows="3" placeholder="Any notes or remarks"></textarea>
          </div>
        </div>

        <div class="mt-4">
          <button type="submit">💾 Save Report</button>
          <a th:href="@{/death-reports}" class="ms-3" style="color:var(--text-secondary);">⬅ Back to List</a>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
