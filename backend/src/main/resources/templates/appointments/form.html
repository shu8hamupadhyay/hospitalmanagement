<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${appointment.id == null ? 'Add Appointment' : 'Edit Appointment'}">Appointment</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Sidebar Shared Styles -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    :root {
      --bg-dark: #0f0f10;
      --bg-card: #1a1a1c;
      --gold: #d4af37;
      --text-light: #f3f3f3;
      --text-muted: #b3b3b3;
      --border-dark: #2a2a2d;
      --sidebar-width: 260px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      margin: 0;
    }

    /* 🌟 Sidebar Layout Fix */
    .layout-container {
      display: flex;
      width: 100%;
    }

    /* Sidebar area */
    .sidebar {
      width: var(--sidebar-width);
      background-color: #151515;
      border-right: 1px solid var(--border-dark);
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 1000;
      transition: all 0.3s ease;
    }

    /* Main content area */
    .main-content {
      flex-grow: 1;
      padding: 40px;
      margin-left: var(--sidebar-width);
      transition: margin-left 0.3s ease;
      background-color: var(--bg-dark);
      min-height: 100vh;
    }

    h3 {
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 25px;
    }

    label {
      font-weight: 500;
      color: var(--text-muted);
    }

    .form-control,
    .form-select {
      background-color: #111;
      border: 1px solid #333;
      color: var(--text-light);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 6px var(--gold);
      background-color: #151515;
      color: #fff;
    }

    .form-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.08);
      padding: 35px;
      max-width: 900px;
      margin: auto;
    }

    .btn-save {
      background-color: var(--gold);
      color: black;
      border: none;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      transition: 0.3s ease;
    }

    .btn-save:hover {
      background-color: #caa632;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: #333;
      color: var(--text-light);
      border: none;
    }

    .btn-secondary:hover {
      background-color: #444;
    }

    /* 🔽 Mobile Sidebar Toggle */
    .sidebar-toggle {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      background: var(--gold);
      color: black;
      border: none;
      border-radius: 6px;
      z-index: 1100;
      font-size: 1.2rem;
      padding: 6px 10px;
    }

    /* 📱 Mobile Responsive Adjustments */
    @media (max-width: 992px) {
      .sidebar {
        transform: translateX(-100%);
        position: fixed;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .sidebar-toggle {
        display: block;
      }
    }
  </style>
</head>

<body>
  <div class="layout-container">
    <!-- Sidebar Toggle Button (Visible on Mobile) -->
    <button class="sidebar-toggle" id="sidebarToggle">
      <i class="bi bi-list"></i>
    </button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar" th:replace="fragments/sidebar :: sidebar"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="form-card">
        <h3>
          <i class="bi bi-calendar2-plus"></i>
          <span th:text="${appointment.id == null ? 'Add New Appointment' : 'Edit Appointment'}"></span>
        </h3>

        <form th:action="@{/appointments}" th:object="${appointment}" method="post">
          <input type="hidden" th:field="*{id}" />

          <div class="row g-3">
            <!-- 🧍 Patient -->
            <div class="col-md-6">
              <label class="form-label">Patient *</label>
              <select class="form-select" th:field="*{patient.id}" required>
                <option value="">-- Select Patient --</option>
                <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name + ' (ID: ' + p.id + ')'}"></option>
              </select>
            </div>

            <!-- 🏥 Department -->
            <div class="col-md-6">
              <label class="form-label">Department *</label>
              <select class="form-select" id="departmentSelect" th:field="*{department.id}" required>
                <option value="">-- Select Department --</option>
                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
              </select>
            </div>

            <!-- 👩‍⚕️ Doctor -->
            <div class="col-md-6">
              <label class="form-label">Doctor *</label>
              <select class="form-select" id="doctorSelect" th:field="*{doctor.id}" required>
                <option value="">-- Select Doctor --</option>
                <option th:each="doc : ${doctors}" th:value="${doc.id}" th:text="${doc.name + ' - ' + doc.specialization}"></option>
              </select>
            </div>

            <!-- 📅 Appointment Date -->
            <div class="col-md-6">
              <label class="form-label">Appointment Date & Time *</label>
              <input type="datetime-local" class="form-control" th:field="*{appointmentDate}" required>
            </div>

            <!-- 💬 Problem -->
            <div class="col-md-6">
              <label class="form-label">Problem / Complaint *</label>
              <input type="text" class="form-control" th:field="*{problem}" placeholder="Enter patient's issue" required>
            </div>

            <!-- 🧾 Status -->
            <div class="col-md-6">
              <label class="form-label">Status *</label>
              <select class="form-select" th:field="*{status}" required>
                <option value="">-- Select Status --</option>
                <option value="Active" th:selected="${appointment.status == 'Active'}">Active</option>
                <option value="Completed" th:selected="${appointment.status == 'Completed'}">Completed</option>
                <option value="Cancelled" th:selected="${appointment.status == 'Cancelled'}">Cancelled</option>
              </select>
            </div>

            <!-- 🪪 Token (Auto Generated) -->
            <div class="col-md-6">
              <label class="form-label">Token Number</label>
              <input type="text" class="form-control" th:field="*{serialNo}" readonly placeholder="Auto-generated">
            </div>
          </div>

          <div class="text-end mt-4">
            <button type="submit" class="btn btn-save">
              <i class="bi bi-check-circle me-1"></i> Save Appointment
            </button>
            <a th:href="@{/appointments}" class="btn btn-secondary ms-2">
              <i class="bi bi-arrow-left"></i> Back
            </a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- ✅ Dynamic Doctor Filter -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const deptSelect = document.getElementById('departmentSelect');
      const doctorSelect = document.getElementById('doctorSelect');

      deptSelect.addEventListener('change', function () {
        const deptId = this.value;
        doctorSelect.innerHTML = '<option value="">Loading doctors...</option>';

        fetch(`/appointments/doctors/by-department/${deptId}`)
          .then(res => res.json())
          .then(data => {
            doctorSelect.innerHTML = '<option value="">-- Select Doctor --</option>';
            data.forEach(doc => {
              const opt = document.createElement('option');
              opt.value = doc.id;
              opt.textContent = `${doc.name} - ${doc.specialization}`;
              doctorSelect.appendChild(opt);
            });
          })
          .catch(() => {
            doctorSelect.innerHTML = '<option value="">Error loading doctors</option>';
          });
      });

      // 🔘 Sidebar toggle logic for mobile
      const sidebarToggle = document.getElementById('sidebarToggle');
      const sidebar = document.getElementById('sidebar');
      sidebarToggle.addEventListener('click', () => {
        sidebar.classList.toggle('open');
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
