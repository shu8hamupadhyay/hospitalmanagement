<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Contact</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>

  <!-- Shared sidebar styling -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    /* Page-specific styling */
    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 40px;
      background-color: #1f2937;
      color: #e5e7eb;
      min-height: 100vh;
    }

    h1 {
      color: #60a5fa;
      font-weight: 600;
      margin-bottom: 25px;
    }

    label {
      font-weight: 500;
      color: #cbd5e1;
    }

    .form-control,
    .form-select {
      background-color: #111827;
      border: 1px solid #374151;
      color: #e5e7eb;
    }

    .form-control:focus,
    .form-select:focus {
      background-color: #1e293b;
      color: #fff;
      border-color: #3b82f6;
      box-shadow: none;
    }

    .btn {
      border-radius: 8px;
      font-weight: 500;
      padding: 10px 20px;
    }

    .btn-success {
      background-color: #10b981;
      border: none;
    }

    .btn-success:hover {
      background-color: #059669;
    }

    .btn-secondary {
      background-color: #374151;
      border: none;
    }

    .btn-secondary:hover {
      background-color: #4b5563;
    }

    @media (max-width: 768px) {
      .main-content {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="layout-container">
    <!-- Include the Sidebar Fragment -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
      <h1><i class="bi bi-pencil-square"></i> Edit Contact</h1>

      <form th:action="@{'/contacts/update/' + ${contact.id}}" th:object="${contact}" method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" th:field="*{name}" placeholder="Enter contact name" required/>
          </div>

          <div class="col-md-6">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" th:field="*{email}" placeholder="contact@email.com" required/>
          </div>

          <div class="col-md-6">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-control" th:field="*{phone}" placeholder="e.g. +91 9876543210" required/>
          </div>

          <div class="col-md-6">
            <label class="form-label">Company</label>
            <input type="text" class="form-control" th:field="*{company}" placeholder="Enter company name"/>
          </div>

          <div class="col-md-6">
            <label class="form-label">Category</label>
            <select class="form-select" th:field="*{category}">
              <option value="">Select Category</option>
              <option value="Client">Client</option>
              <option value="Vendor">Vendor</option>
              <option value="Partner">Partner</option>
              <option value="Employee">Employee</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="col-12 d-flex justify-content-between mt-4">
          <a th:href="@{/contacts}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back
          </a>
          <button type="submit" class="btn btn-success">
            <i class="bi bi-save"></i> Update
          </button>
        </div>
      </form>
    </main>
  </div>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
