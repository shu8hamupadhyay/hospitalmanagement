<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Contact</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>

  <!-- Import sidebar CSS -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>

  <style>
    /* Layout Wrapper */
    .layout-container {
      display: flex;
      min-height: 100vh;
      background-color: #0f1112;
      color: #e5e7eb;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }

    /* Main Content Area */
    .main-content {
      flex-grow: 1;
      margin-left: 260px;
      padding: 40px;
      background-color: #1f2937;
      border-top-left-radius: 15px;
      border-bottom-left-radius: 15px;
      transition: all 0.3s ease;
    }

    h1 {
      color: #60a5fa;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .card {
      background-color: #111827;
      border: 1px solid #374151;
      color: #e5e7eb;
      border-radius: 12px;
      padding: 25px;
    }

    .card strong {
      color: #93c5fd;
    }

    .btn-secondary {
      background-color: #374151;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      padding: 10px 20px;
    }

    .btn-secondary:hover {
      background-color: #4b5563;
    }

    /* Mobile view adjustments */
    @media (max-width: 768px) {
      .main-content {
        margin-left: 0;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="layout-container">
    
    <!-- ✅ Import Sidebar Fragment -->
    <aside th:replace="fragments/sidebar :: sidebar"></aside>

    <!-- ✅ Main Content -->
    <main class="main-content">
      <h1><i class="bi bi-person-lines-fill"></i> View Contact</h1>

      <div class="card shadow">
        <h3 th:text="${contact.name}" class="mb-3"></h3>
        <p><strong><i class="bi bi-envelope"></i> Email:</strong> <span th:text="${contact.email}"></span></p>
        <p><strong><i class="bi bi-telephone"></i> Phone:</strong> <span th:text="${contact.phone}"></span></p>
        <p><strong><i class="bi bi-building"></i> Company:</strong> <span th:text="${contact.company}"></span></p>
        <p><strong><i class="bi bi-tags"></i> Category:</strong> <span th:text="${contact.category}"></span></p>
        <p><strong><i class="bi bi-calendar3"></i> Created:</strong>
          <span th:text="${#temporals.format(contact.createdAt, 'dd MMM yyyy')}"></span></p>
      </div>

      <div class="mt-4">
        <a th:href="@{/contacts}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Mobile sidebar toggle
    document.addEventListener("DOMContentLoaded", function() {
      const toggleBtn = document.getElementById("sidebarToggle");
      const sidebar = document.querySelector(".sidebar");
      const overlay = document.createElement("div");
      overlay.classList.add("sidebar-overlay");
      document.body.appendChild(overlay);

      toggleBtn?.addEventListener("click", () => {
        sidebar.classList.toggle("active");
        overlay.classList.toggle("active");
      });

      overlay.addEventListener("click", () => {
        sidebar.classList.remove("active");
        overlay.classList.remove("active");
      });
    });
  </script>
</body>
</html>
