<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Birth Report</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />

  <style>
    :root {
      --bg-main: #0d1117;
      --bg-sidebar: #161b22;
      --bg-card: #1c2128;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --hover-green: #238636;
      --shadow-soft: rgba(56, 139, 253, 0.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 25px 20px;
      border-right: 1px solid var(--border-color);
    }

    .sidebar h2 {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 30px;
      color: var(--accent-blue);
    }

    .nav-link {
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .nav-link:hover {
      background-color: var(--hover-green);
      color: #fff;
      transform: translateX(4px);
    }

    .nav-link.active {
      background: linear-gradient(90deg, var(--hover-green), var(--accent-green));
      color: #fff;
    }

    /* Main Content */
    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 40px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 0 15px var(--shadow-soft);
      padding: 35px;
      color: var(--text-primary);
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      color: var(--accent-blue);
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    p {
      font-size: 1rem;
      margin-bottom: 10px;
      color: var(--text-secondary);
    }

    strong {
      color: var(--accent-green);
      font-weight: 600;
    }

    .btn-back {
      background-color: var(--hover-green);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .btn-back:hover {
      background-color: var(--accent-green);
      color: #fff;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      body {
        flex-direction: column;
      }
      .main-content {
        padding: 20px;
      }
    }
  </style>
</head>

<body>


  <!-- Sidebar Toggle Button -->
  <button class="toggle-btn" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <!-- Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>


  <!-- Main Content -->
  <main class="main-content">
    <div class="card">
      <h1 th:text="${report.babyName}">Baby Name</h1>

      <p><strong>Mother:</strong> <span th:text="${report.motherName}">Mrs. Sharma</span></p>
      <p><strong>Father:</strong> <span th:text="${report.fatherName}">Mr. Sharma</span></p>
      <p><strong>Gender:</strong> <span th:text="${report.gender}">Female</span></p>
      <p><strong>Birth Date:</strong> <span th:text="${#temporals.format(report.birthDateTime, 'dd MMM yyyy HH:mm')}">01 Nov 2025 10:30</span></p>
      <p><strong>Doctor:</strong> <span th:text="${report.doctorName}">Dr. Mehta</span></p>
      <p><strong>Remarks:</strong> <span th:text="${report.remarks}">Healthy newborn</span></p>

      <div class="mt-4">
        <a href="/birth-reports" class="btn-back"><i class="bi bi-arrow-left"></i> Back to Reports</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
