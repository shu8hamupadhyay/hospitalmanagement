<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${patient.id == null ? 'Add New Patient | HMS Admin' : 'Edit Patient | HMS Admin'}">
    Patient Form | HMS Admin
  </title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    :root {
      --bg-main: #0d1117;
      --bg-card: #1c2128;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-red: #f85149;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      overflow-y: auto;
    }

    .sidebar {
      width: 250px;
      position: fixed;
      height: 100vh;
      background-color: #161b22;
      z-index: 1000;
    }

    .main-content {
      flex-grow: 1;
      margin-left: 260px;
      padding: 40px;
      background-color: var(--bg-main);
    }

    h1 {
      color: var(--accent-blue);
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      padding: 25px;
    }

    .form-section {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
      background-color: #1a222b;
    }

    .form-section h5 {
      color: var(--accent-green);
      font-weight: 600;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .form-label {
      color: var(--text-secondary);
      font-weight: 600;
    }

    .form-control, .form-select {
      background-color: #22272e;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 8px;
      padding: 10px;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 0.25rem rgba(88,166,255,0.25);
      background-color: #2d333b;
    }

    .btn {
      border-radius: 8px;
      font-weight: 600;
      padding: 10px 20px;
    }

    .btn-success {
      background-color: var(--accent-green);
      border: none;
    }
    .btn-success:hover { background-color: #359844; }

    .btn-secondary {
      background-color: var(--border-color);
      color: var(--text-primary);
      border: none;
    }
    .btn-secondary:hover { background-color: #3d4451; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; padding: 20px; }
    }
  </style>
</head>

<body>
<!-- Sidebar include -->
<div th:replace="fragments/sidebar :: sidebar" class="sidebar"></div>

<main class="main-content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 th:text="${patient.id == null ? 'Add New Patient' : 'Edit Patient: ' + patient.name}">
      Patient Form
    </h1>
  </div>

  <div class="card">
    <form th:action="${patient.id == null} ? @{/patients} : @{/patients/update/{id}(id=${patient.id})}"
          th:object="${patient}" method="post">
      <input type="hidden" th:field="*{id}" />

      <!-- 🧍 PERSONAL INFORMATION -->
      <div class="form-section">
        <h5>Personal Information</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" th:field="*{name}" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Phone Number</label>
            <input type="tel" th:field="*{phone}" class="form-control">
          </div>

          <div class="col-md-3">
            <label class="form-label">Gender</label>
            <select th:field="*{gender}" class="form-select">
              <option value="">Select</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Date of Birth</label>
            <input type="date" th:field="*{dob}" class="form-control" required>
          </div>

          <div class="col-md-3">
            <label class="form-label">Age</label>
            <input type="number" th:field="*{age}" class="form-control" min="0">
          </div>

          <div class="col-md-3">
            <label class="form-label">Blood Group</label>
            <select th:field="*{bloodGroup}" class="form-select">
              <option value="">Select</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Marital Status</label>
            <select th:field="*{maritalStatus}" class="form-select">
              <option value="">Select</option>
              <option value="Single">Single</option>
              <option value="Married">Married</option>
              <option value="Divorced">Divorced</option>
              <option value="Widowed">Widowed</option>
            </select>
          </div>

          <div class="col-md-9">
            <label class="form-label">Address</label>
            <input type="text" th:field="*{address}" class="form-control">
          </div>

          <div class="col-md-4">
            <label class="form-label">City</label>
            <input type="text" th:field="*{city}" class="form-control">
          </div>

          <div class="col-md-4">
            <label class="form-label">State</label>
            <input type="text" th:field="*{state}" class="form-control">
          </div>

          <div class="col-md-4">
            <label class="form-label">Country</label>
            <input type="text" th:field="*{country}" class="form-control">
          </div>
        </div>
      </div>

      <!-- 💳 INSURANCE DETAILS -->
      <div class="form-section">
        <h5>Insurance Details</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Insurance Provider</label>
            <input type="text" th:field="*{insuranceProvider}" class="form-control" placeholder="e.g., Star Health, HDFC ERGO">
          </div>
          <div class="col-md-6">
            <label class="form-label">Policy Number</label>
            <input type="text" th:field="*{insurancePolicyNumber}" class="form-control" placeholder="e.g., SH12345">
          </div>
        </div>
      </div>

      <!-- 👨‍⚕️ ASSIGN DOCTOR -->
      <div class="form-section">
        <h5>Assign Doctor</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Select Doctor</label>
            <select th:field="*{doctor.id}" class="form-select" required>
              <option value="">-- Select Doctor --</option>
              <option th:each="d : ${doctors}"
                      th:value="${d.id}"
                      th:text="${d.name + ' - ' + d.specialization}">
              </option>
            </select>
          </div>
        </div>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="d-flex justify-content-end gap-3">
        <a th:href="@{/patients}" class="btn btn-secondary">
          <i class="bi bi-x-circle"></i> Cancel
        </a>
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-circle"></i> Save Patient
        </button>
      </div>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
