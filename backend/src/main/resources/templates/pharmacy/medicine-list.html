<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Medicine List</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Sidebar Styles -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />

  <style>
    /* 🌙 Dark Theme */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #121212;
      color: #f1f1f1;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Sidebar Width = 250px */
    .main-content {
      margin-left: 250px;
      padding: 40px;
      width: calc(100% - 250px);
      background-color: #181818;
      overflow-y: auto;
      min-height: 100vh;
      transition: all 0.3s ease;
    }

    /* Table Style */
    .table {
      background-color: #212121;
      border: 1px solid #2c2c2c;
      color: #fff;
    }

    .table-dark {
      background-color: #1f1f1f;
      border-bottom: 2px solid #00bcd4;
    }

    .table tbody tr td {
      background-color: #212121;
      border-color: #383838;
    }

    .table-striped tbody tr:nth-of-type(odd) td {
      background-color: #262626;
    }

    .table tbody tr:hover td {
      background-color: #2b2b2b !important;
      cursor: pointer;
    }

    /* Buttons */
    .btn-primary {
      background-color: #00bcd4;
      border-color: #00bcd4;
      color: #000;
      font-weight: 600;
    }

    .btn-info {
      background-color: #0288d1 !important;
      border-color: #0288d1 !important;
    }

    .btn-warning {
      background-color: #ffc107;
      border-color: #ffc107;
      color: #000 !important;
    }

    /* Mobile Toggle */
    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: #00bcd4;
      font-size: 1.8rem;
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1101;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      opacity: 0;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    @media (max-width: 768px) {
      .main-content {
        margin-left: 0;
        width: 100%;
        padding: 20px;
      }

      .mobile-toggle {
        display: block;
      }

      body.sidebar-open {
        overflow: hidden;
      }

      .sidebar {
        left: -260px;
      }

      .sidebar.active {
        left: 0;
      }
    }
  </style>
</head>

<body>

  <!-- 🍔 Mobile Toggle -->
  <button class="mobile-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <!-- Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- 📋 Main Content -->
  <main class="main-content">
    <div class="container-fluid">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
          <i class="bi bi-capsule me-2"></i>
          Medicine List
        </h2>
        <a href="/pharmacy/add" class="btn btn-primary shadow">
          <i class="bi bi-plus-circle me-2"></i>Add New Medicine
        </a>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Manufacturer</th>
              <th>Price (₹)</th>
              <th>Stock</th>
              <th>Expiry</th>
              <th>Location</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="medicine : ${medicines}">
              <td th:text="${medicine.id}"></td>
              <td th:text="${medicine.name}"></td>
              <td th:text="${medicine.manufacturer}"></td>
              <td th:text="${medicine.price}"></td>
              <td th:text="${medicine.stockQuantity}"></td>
              <td th:text="${medicine.expiryDate}"></td>
              <td th:text="${medicine.location}"></td>

              <td class="text-center">
                <a th:href="@{'/pharmacy/view/' + ${medicine.id}}" 
                   class="btn btn-sm btn-info text-white me-1">
                  <i class="bi bi-eye"></i>
                </a>

                <a th:href="@{'/pharmacy/edit/' + ${medicine.id}}" 
                   class="btn btn-sm btn-warning">
                  <i class="bi bi-pencil"></i>
                </a>
              </td>
            </tr>

            <tr th:if="${#lists.isEmpty(medicines)}">
              <td colspan="8" class="text-center text-muted py-4">
                No medicines found.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Sidebar Toggle Script -->
  <script>
    const toggleBtn = document.getElementById("sidebarToggle");
    const sidebar   = document.querySelector(".sidebar");
    const overlay   = document.getElementById("sidebarOverlay");

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("active");
      overlay.classList.toggle("active");
      document.body.classList.toggle("sidebar-open");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
      document.body.classList.remove("sidebar-open");
    });
  </script>

</body>
</html>
