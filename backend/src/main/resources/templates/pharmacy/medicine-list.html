<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Medicine List</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Shared Sidebar Styles -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />

  <style>
    /* 🌙 Dark Theme */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #121212;
      color: #f1f1f1;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      transition: all 0.3s ease;
    }

    /* 🧭 Sidebar Layout Fix */
    .sidebar {
      width: 250px;
      background-color: #1e1e1e;
      color: #fff;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      padding: 20px;
      border-right: 1px solid #2c2c2c;
      z-index: 1000;
      transition: all 0.3s ease;
    }

    /* ✅ Proper Main Content Alignment */
    .main-content {
      margin-left: 250px; /* matches sidebar width */
      flex-grow: 1;
      overflow-y: auto;
      padding: 40px;
      background-color: #181818;
      transition: all 0.3s ease;
      width: calc(100% - 250px);
    }

    /* 📋 Table Styling */
    .table {
      background-color: #212121;
      border: 1px solid #2c2c2c;
      color: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    .table-dark {
      background-color: #1e1e1e;
      border-bottom: 2px solid #00bcd4;
    }

    .table tbody tr td {
      background-color: #212121;
      color: #f1f1f1;
      border-color: #3a3a3a;
    }

    .table-striped > tbody > tr:nth-of-type(odd) > td {
      background-color: #252525;
    }

    .table tbody tr:hover td {
      background-color: #2a2a2a !important;
      cursor: pointer;
    }

    .table tbody tr:hover {
      border-bottom: 1px solid #00bcd4 !important;
      border-top: 1px solid #00bcd4 !important;
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    /* 🧱 Buttons */
    .btn-primary {
      background-color: #00bcd4;
      border-color: #00bcd4;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background-color: #0097a7;
      border-color: #0097a7;
    }

    .btn-warning {
      background-color: #ffc107;
      border-color: #ffc107;
      color: #000 !important;
    }

    /* 📱 Mobile Sidebar Toggle */
    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: #00bcd4;
      font-size: 1.8rem;
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1101;
    }

    /* 🔳 Sidebar Overlay for Mobile */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    @media (max-width: 768px) {
      .sidebar {
        left: -260px;
        transition: all 0.3s ease;
      }

      .sidebar.active {
        left: 0;
      }

      .main-content {
        margin-left: 0;
        width: 100%;
        padding: 20px;
      }

      .mobile-toggle {
        display: block;
      }

      body.sidebar-open {
        overflow: hidden;
      }
    }
  </style>
</head>

<body>
  <!-- 🍔 Mobile Toggle Button -->
  <button class="mobile-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <!-- 🌫️ Overlay for Mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- 🧭 Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- 📋 Main Content -->
  <main class="main-content">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-capsule me-2"></i>Medicine List</h2>
        <a href="/pharmacy/add" class="btn btn-primary shadow-sm">
          <i class="bi bi-plus-circle me-2"></i>Add New Medicine
        </a>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Manufacturer</th>
              <th>Price (₹)</th>
              <th>Stock</th>
              <th>Expiry Date</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="medicine : ${medicines}">
              <td th:text="${medicine.id}"></td>
              <td th:text="${medicine.name}"></td>
              <td th:text="${medicine.manufacturer}"></td>
              <td th:text="${medicine.price}"></td>
              <td th:text="${medicine.stockQuantity}"></td>
              <td th:text="${medicine.expiryDate}"></td>
              <td class="text-center">
                <a th:href="@{'/pharmacy/view/' + ${medicine.id}}" class="btn btn-sm btn-info text-white">
                  <i class="bi bi-eye"></i> View
                </a>
                <a th:href="@{'/pharmacy/edit/' + ${medicine.id}}" class="btn btn-sm btn-warning">
                  <i class="bi bi-pencil"></i> Edit
                </a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(medicines)}">
              <td colspan="7" class="text-center text-muted">No medicines found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 🧠 Sidebar Toggle Script -->
  <script>
    const toggleBtn = document.getElementById("sidebarToggle");
    const sidebar = document.querySelector(".sidebar");
    const overlay = document.getElementById("sidebarOverlay");

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("active");
      overlay.classList.toggle("active");
      document.body.classList.toggle("sidebar-open");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
      document.body.classList.remove("sidebar-open");
    });
  </script>
</body>
</html>
