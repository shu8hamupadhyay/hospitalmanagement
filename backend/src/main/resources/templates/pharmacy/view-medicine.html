<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Medicine Details</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Sidebar CSS -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #121212;
      color: #f1f1f1;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 40px;
      background-color: #181818;
      margin-left: 260px;
      width: calc(100% - 260px);
      transition: all 0.3s ease;
    }

    .card {
      background-color: #212121;
      border: 1px solid #2c2c2c;
      border-radius: 12px;
    }

    h2 {
      color: #00bcd4;
      font-weight: 600;
    }

    dt {
      font-weight: 600;
      color: #90a4ae;
    }

    dd {
      color: #eceff1;
    }

    .btn-warning {
      background-color: #ffb300;
      border-color: #ffb300;
      color: #000;
    }

    .btn-warning:hover {
      background-color: #ffa000;
    }

    .btn-secondary {
      background-color: #424242;
      border-color: #424242;
    }

    .btn-secondary:hover {
      background-color: #616161;
    }

    /* Mobile Adjustments */
    @media (max-width: 992px) {
      .main-content {
        margin-left: 0;
        width: 100%;
        padding: 20px;
      }

      .mobile-toggle {
        display: block;
      }
    }

    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: #00bcd4;
      font-size: 1.8rem;
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1100;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- Mobile Toggle -->
  <button class="mobile-toggle" id="sidebarToggle">
    <i class="bi bi-list"></i>
  </button>

  <!-- Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container">

      <div class="card shadow p-4">
        <h2 class="mb-4 text-center">Medicine Details</h2>

        <dl class="row">

          <dt class="col-sm-4">Name:</dt>
          <dd class="col-sm-8" th:text="${medicine.name}"></dd>

          <dt class="col-sm-4">Manufacturer:</dt>
          <dd class="col-sm-8" th:text="${medicine.manufacturer}"></dd>

          <dt class="col-sm-4">Batch Number:</dt>
          <dd class="col-sm-8" th:text="${medicine.batchNumber}"></dd>

          <dt class="col-sm-4">Composition:</dt>
          <dd class="col-sm-8" th:text="${medicine.composition}"></dd>

          <dt class="col-sm-4">Type:</dt>
          <dd class="col-sm-8" th:text="${medicine.type}"></dd>

          <dt class="col-sm-4">Price:</dt>
          <dd class="col-sm-8">
            ₹<span th:text="${medicine.price}"></span>
          </dd>

          <dt class="col-sm-4">Stock Quantity:</dt>
          <dd class="col-sm-8" th:text="${medicine.stockQuantity}"></dd>

          <dt class="col-sm-4">Expiry Date:</dt>
          <dd class="col-sm-8" th:text="${medicine.expiryDate}"></dd>

          <dt class="col-sm-4">Description:</dt>
          <dd class="col-sm-8" th:text="${medicine.description}"></dd>

          <dt class="col-sm-4">Location:</dt>
          <dd class="col-sm-8" th:text="${medicine.location}"></dd>

        </dl>

        <div class="d-flex justify-content-between mt-4">
          <a href="/pharmacy/medicines" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to List
          </a>

          <a th:href="@{'/pharmacy/edit/' + ${medicine.id}}" class="btn btn-warning">
            <i class="bi bi-pencil"></i> Edit Details
          </a>
        </div>

      </div>

    </div>
  </div>

  <!-- Sidebar Toggle Script -->
  <script>
    const toggleBtn = document.getElementById("sidebarToggle");
    const sidebar = document.querySelector(".sidebar");
    const overlay = document.getElementById("sidebarOverlay");

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("active");
      overlay.classList.toggle("active");
      document.body.classList.toggle("sidebar-open");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
      document.body.classList.remove("sidebar-open");
    });
  </script>

</body>
</html>
