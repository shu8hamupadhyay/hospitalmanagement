<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${formTitle}">Add Medicine</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Sidebar Styles -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>

  <style>
    /* Dark theme */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f1115;
      color: #eaeaea;
      display: flex;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .main-content {
      flex-grow: 1;
      padding: 40px;
      background-color: #15171c;
      margin-left: 260px;
      width: calc(100% - 260px);
      overflow-y: auto;
    }

    .card {
      background-color: #1e2128;
      border: 1px solid #2c2f36;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
    }

    .form-control,
    textarea {
      background-color: #262a33;
      color: #fff;
      border: 1px solid #383c45;
      border-radius: 8px;
    }

    .form-control:focus {
      background-color: #2c313c;
      border-color: #00acc1;
      box-shadow: 0 0 0 0.25rem rgba(0, 172, 193, 0.25);
    }

    label {
      color: #d5d5d5;
    }

    .btn-success {
      background-color: #00acc1;
      border-color: #00acc1;
    }

    .btn-success:hover {
      background-color: #0097a7;
    }

    .btn-secondary {
      background-color: #2e323c;
      border-color: #2e323c;
    }

    .btn-secondary:hover {
      background-color: #424752;
    }

    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: #00acc1;
      font-size: 1.8rem;
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1100;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      opacity: 0;
      transition: 0.3s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    @media (max-width: 992px) {
      .main-content {
        margin-left: 0;
        width: 100%;
        padding: 20px;
      }

      .mobile-toggle {
        display: block;
      }

      .sidebar {
        left: -260px;
        position: fixed;
        top: 0;
        height: 100%;
        z-index: 1000;
        transition: all 0.3s ease;
      }

      .sidebar.active {
        left: 0;
      }
    }
  </style>
</head>

<body>

<!-- Mobile Menu Button -->
<button class="mobile-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>

<!-- Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Main Content -->
<main class="main-content">
  <div class="container">
    <div class="card shadow p-4">

      <h2 class="mb-4 text-center" th:text="${formTitle}">Add Medicine</h2>

      <!-- FORM -->
      <form th:action="${formAction}" th:object="${medicine}" method="post">

        <!-- ✔ ONLY SHOW ID FIELD WHEN EDITING -->
        <input type="hidden" th:if="*{id} != null" th:field="*{id}" />

        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Medicine Name</label>
            <input type="text" class="form-control" th:field="*{name}" required placeholder="Enter name">
          </div>

          <div class="col-md-6">
            <label class="form-label">Manufacturer</label>
            <input type="text" class="form-control" th:field="*{manufacturer}">
          </div>

          <div class="col-md-6">
            <label class="form-label">Batch Number</label>
            <input type="text" class="form-control" th:field="*{batchNumber}">
          </div>

          <div class="col-md-6">
            <label class="form-label">Expiry Date</label>
            <input type="date" class="form-control" th:field="*{expiryDate}">
          </div>

          <div class="col-md-6">
            <label class="form-label">Composition</label>
            <input type="text" class="form-control" th:field="*{composition}">
          </div>

          <div class="col-md-6">
            <label class="form-label">Type</label>
            <input type="text" class="form-control" th:field="*{type}" placeholder="Tablet, Syrup, etc.">
          </div>

          <div class="col-md-6">
            <label class="form-label">Price (₹)</label>
            <input type="number" class="form-control" th:field="*{price}" step="0.01">
          </div>

          <div class="col-md-6">
            <label class="form-label">Stock Quantity</label>
            <input type="number" class="form-control" th:field="*{stockQuantity}">
          </div>

          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
          </div>

        </div>

        <div class="d-flex justify-content-between mt-4">
          <a href="/pharmacy/medicines" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back
          </a>

          <button type="submit" class="btn btn-success">
            <i class="bi bi-save"></i> Save Medicine
          </button>
        </div>

      </form>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const toggleBtn = document.getElementById("sidebarToggle");
  const sidebar = document.querySelector(".sidebar");
  const overlay = document.getElementById("sidebarOverlay");

  toggleBtn.addEventListener("click", () => {
    sidebar.classList.toggle("active");
    overlay.classList.toggle("active");
  });

  overlay.addEventListener("click", () => {
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
  });
</script>

</body>
</html>
