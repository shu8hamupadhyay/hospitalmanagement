# ==========================================================
# 🌐 Application Configuration
# ==========================================================
spring.application.name=hospitalmanagement

# ==========================================================
# 🗄️ Database (H2)
# ==========================================================
spring.datasource.url=jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================================
# ⚙️ Hibernate & JPA
# ==========================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ✅ IMPORTANT: Ensures Hibernate runs BEFORE data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.datasource.initialization-order=after-jpa
spring.sql.init.continue-on-error=true

# ==========================================================
# 🧰 H2 Console
# ==========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================================
# 🌍 Server
# ==========================================================
server.port=8080

# ==========================================================
# 🔐 Security
# ==========================================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ==========================================================
# 🌐 CORS
# ==========================================================
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ==========================================================
# 🧠 Lazy Initialization OFF (forces table creation first)
# ==========================================================
spring.main.lazy-initialization=false
