# src/test/resources/application-test.properties

# Database Configuration (Ensures an in-memory database is used for tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration (Forces a fresh schema for every test run)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Security Configuration (If your test doesn't need security to be fully configured)
# The application-test profile should override the defaults from application.properties
spring.security.user.name=testuser
spring.security.user.password=testpass