<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${doctor.id} != null ? 'Edit Doctor | HMS Admin' : 'Add Doctor | HMS Admin'">Add/Edit Doctor</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    /* Theme Variables from Dashboard Template */
    :root {
      --bg-main: #0d1117;
      --bg-card: #1c2128;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-red: #f85149;
      --shadow-soft: rgba(56, 139, 253, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      overflow-y: hidden; /* Prevent body scroll */
    }

.form-control {
  background-color: #2a2d31;
  border: 1px solid var(--border-color);
  color: var(--text-primary); /* White text */
  border-radius: 8px;
}

.form-control::placeholder {
  color: rgba(230, 237, 243, 0.7); /* Softer white for placeholder */
}

.form-control:focus {
  background-color: #2a2d31;
  border-color: var(--accent-blue);
  color: var(--text-primary);
  box-shadow: 0 0 0 0.25rem rgba(88, 166, 255, 0.25);
}


    /* Sidebar Styling for fixed position and width */
    .sidebar {
      width: 250px;
      flex-shrink: 0;
      position: fixed; /* CRITICAL for side-by-side layout */
      height: 100vh;
      background-color: #161b22; 
      z-index: 1000;
      overflow-y: auto;
    }

    /* Main Content Alignment Fix */
    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 40px;
      margin-left: 260px; /* CRITICAL ALIGNMENT: Pushes main content past the fixed sidebar */
      transition: margin-left 0.3s ease;
      background-color: var(--bg-main);
    }

    h1 {
      color: var(--accent-blue); /* Updated H1 color */
      font-weight: 700;
      font-size: 2rem;
    }

    .card {
      background-color: var(--bg-card); /* Dark theme card background */
      border: 1px solid var(--border-color); /* Theme border */
      border-radius: 14px;
      box-shadow: 0 0 15px var(--shadow-soft); /* Soft theme shadow */
      max-width: 700px;
      margin: 0 auto; 
      padding: 30px;
    }

    label {
      font-weight: 500;
      color: var(--text-primary); /* Light text for labels */
    }

    .form-control {
      background-color: #2a2d31;
      border: 1px solid var(--border-color); /* Darker border */
      color: var(--text-primary);
      border-radius: 8px; 
    }

    .form-control:focus {
      background-color: #2a2d31;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 0.25rem rgba(88, 166, 255, 0.25); /* Blue focus shadow */
    }

    /* Button Styling (Matching theme buttons) */
    .btn {
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-success {
      background-color: var(--accent-green);
      border: none;
    }

    .btn-success:hover {
      background-color: #359844; 
    }

    .btn-secondary {
      color: var(--text-primary); 
      background-color: #30363d; /* Darker secondary button color */
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #444c56;
    }
    
    .btn-outline-light {
        color: var(--text-primary);
        border-color: var(--border-color);
    }
    .btn-outline-light:hover {
        color: var(--bg-main);
        background-color: var(--text-primary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        overflow-y: auto;
      }
      .main-content {
        margin-left: 0; 
        padding: 20px;
      }
      .sidebar {
        display: none; 
        position: static;
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

<body>
  <div th:replace="fragments/sidebar :: sidebar" class="sidebar"></div>


  <main class="main-content">
    <div class="container-fluid"> 
      <div class="d-flex align-items-center mb-4">
        <button onclick="history.back()" class="btn btn-outline-light btn-sm me-3">
          <i class="bi bi-arrow-left"></i> Back
        </button>
        <h1 th:text="${doctor.id} != null ? 'Edit Doctor' : 'Add Doctor'">Add Doctor</h1>
      </div>

      <div class="card">
        <form th:action="${doctor.id} != null ? @{/doctors/update/{id}(id=${doctor.id})} : @{/doctors}" method="post" class="row g-3">
          
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" th:value="${doctor.name}" placeholder="Dr. Ayesha Khan" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" th:value="${doctor.email}" placeholder="example@hospital.com" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" name="phone" th:value="${doctor.phone}" placeholder="9876543210" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Qualification</label>
            <input type="text" class="form-control" name="qualification" th:value="${doctor.qualification}" placeholder="MBBS, MD" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Specialization</label>
            <input type="text" class="form-control" name="specialization" th:value="${doctor.specialization}" placeholder="Cardiology, Neurology..." required>
          </div>
          
          <div class="col-md-6">
            </div>

          <div class="col-12 d-flex justify-content-between mt-4">
            <a th:href="@{/doctors}" class="btn btn-secondary">
              <i class="bi bi-x-circle"></i> Cancel
            </a>
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check-circle"></i> Save Doctor
            </button>
          </div>
        </form>
      </div>
    </div> 
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
