<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add/Edit Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { display: flex; height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f4f7f9; }
        .sidebar { width: 250px; background-color: #1e88e5; color: #fff; padding: 20px; flex-shrink: 0; }
        .sidebar h2 { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 30px; }
        .nav-link { color: #e3f2fd; display: flex; align-items: center; gap: 10px; padding: 10px 15px; border-radius: 8px; transition: all 0.2s; text-decoration: none; }
        .nav-link:hover, .nav-link.active { background-color: #1565c0; color: #fff; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 30px; }
        @media (max-width: 768px) { .sidebar { display: none; } body { flex-direction: column; } }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <h2>🏥 HMS Admin</h2>
    <nav class="nav flex-column">
        <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-link active" th:href="@{/doctors}"><i class="bi bi-person-badge"></i> Doctors</a>
        <a class="nav-link" th:href="@{/patients}"><i class="bi bi-people"></i> Patients</a>
        <a class="nav-link" th:href="@{/appointments}"><i class="bi bi-calendar-event"></i> Appointments</a>
        <a class="nav-link" th:href="@{/bills}"><i class="bi bi-cash-coin"></i> Bills</a>
        <a class="nav-link" th:href="@{/prescriptions}"><i class="bi bi-capsule"></i> Prescriptions</a>
        <a class="nav-link" th:href="@{/labreports}"><i class="bi bi-beaker"></i> Lab Reports</a>
    </nav>
</aside>

<!-- Main Content -->
<main class="main-content">
    <h1 class="text-primary mb-4" th:text="${doctor.id} != null ? 'Edit Doctor' : 'Add Doctor'">Add Doctor</h1>
    
<form th:action="${doctor.id} != null ? @{/doctors/update/{id}(id=${doctor.id})} : @{/doctors}" method="post">
        <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" name="name" th:value="${doctor.name}" required/>
        </div>
        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" th:value="${doctor.email}" required/>
        </div>
        <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" name="phone" th:value="${doctor.phone}" required/>
        </div>
        <div class="col-md-6">
            <label class="form-label">Qualification</label>
            <input type="text" class="form-control" name="qualification" th:value="${doctor.qualification}" required/>
        </div>
        <div class="col-md-6">
            <label class="form-label">Specialization</label>
            <input type="text" class="form-control" name="specialization" th:value="${doctor.specialization}" required/>
        </div>
        <div class="col-12 d-flex justify-content-between mt-3">
            <a th:href="@{/doctors}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-success">Save</button>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
