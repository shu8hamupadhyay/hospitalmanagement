<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctors Management | HMS Admin</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    /* =======================================
       🌙 Modern HMS Dark UI Theme
    ======================================== */
    :root {
      --bg-main: #05070d;
      --bg-card: #10161e;
      --bg-hover: #1b2432;
      --border-color: #252c3b;
      --text-primary: #f8f9fa;
      --text-secondary: #aeb8c4;
      --accent-blue: #4fa8ff;
      --accent-green: #3fc76e;
      --accent-red: #f85149;
      --shadow-soft: 0 4px 18px rgba(0,0,0,0.6);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    a { text-decoration: none; }

    /* Sidebar */
    .sidebar {
      width: 250px;
      position: fixed;
      height: 100vh;
      background: linear-gradient(180deg, #0e141d, #0b0f17);
      box-shadow: 2px 0 10px rgba(0,0,0,0.3);
      z-index: 1000;
      overflow-y: auto;
    }

    /* Main Area */
    .main-content {
      flex-grow: 1;
      margin-left: 250px;
      padding: 40px;
      transition: all 0.3s ease;
      min-height: 100vh;
    }

    h1 {
      color: var(--accent-blue);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.9rem;
    }

    /* Subtitle */
    .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    /* Card/Table Container */
    .table-container-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow-soft);
      transition: all 0.3s ease;
    }

    .table-container-card:hover {
      box-shadow: 0 6px 24px rgba(0,0,0,0.7);
      transform: translateY(-2px);
    }

    /* Table Styling */
    .table {
      color: var(--text-primary);
      font-size: 0.95rem;
      border-collapse: separate;
      border-spacing: 0 6px;
      margin-bottom: 0;
    }

    .table thead {
      background-color: #151c26;
      color: var(--accent-blue);
      text-transform: uppercase;
      font-weight: 600;
    }

    .table thead th {
      border: none;
      padding: 12px 15px;
      letter-spacing: 0.5px;
    }

    .table tbody tr {
      background-color: #121922;
      border-radius: var(--radius);
      transition: background-color 0.25s ease, transform 0.15s ease;
    }

    .table tbody tr:hover {
      background-color: var(--bg-hover);
      transform: scale(1.003);
      box-shadow: inset 3px 0 0 var(--accent-blue);
    }

    .table tbody td {
      padding: 15px;
      border-top: 1px solid var(--border-color);
    }

    .table tbody td.text-secondary {
      color: var(--text-secondary) !important;
    }

    /* Buttons */
    .btn {
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s ease, transform 0.1s ease;
      padding: 6px 12px;
      font-size: 0.88rem;
    }
    .btn:active { transform: translateY(1px); }

    .btn-success {
      background-color: var(--accent-green);
      border: none;
      color: #fff;
      box-shadow: 0 0 6px rgba(63, 199, 110, 0.4);
    }
    .btn-success:hover {
      background-color: #36ad5f;
      box-shadow: 0 0 10px rgba(63, 199, 110, 0.7);
    }

    .btn-primary {
      background-color: var(--accent-blue);
      border: none;
      box-shadow: 0 0 6px rgba(79, 168, 255, 0.4);
    }
    .btn-primary:hover {
      background-color: #3c95e8;
      box-shadow: 0 0 10px rgba(79, 168, 255, 0.7);
    }

    .btn-danger {
      background-color: var(--accent-red);
      border: none;
      box-shadow: 0 0 6px rgba(248, 81, 73, 0.4);
    }
    .btn-danger:hover {
      background-color: #dc2626;
      box-shadow: 0 0 10px rgba(248, 81, 73, 0.7);
    }

    /* Hover Animations for Action Buttons */
    .btn i {
      transition: transform 0.2s ease;
    }
    .btn:hover i {
      transform: scale(1.2);
    }

    /* Error Alert Styling */
    .alert-danger {
      background-color: rgba(248, 81, 73, 0.1);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      border-radius: var(--radius);
      padding: 12px 16px;
      box-shadow: 0 0 10px rgba(248, 81, 73, 0.3);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; padding: 20px; }
      h1 { font-size: 1.5rem; }
      .table-container-card { padding: 15px; }
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <div th:replace="fragments/sidebar :: sidebar" class="sidebar"></div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1><i class="bi bi-person-badge"></i> Doctors Management</h1>
      <a class="btn btn-success" th:href="@{/doctors/new}">
        <i class="bi bi-plus-circle"></i> Add Doctor
      </a>
    </div>

    <p class="subtitle">Manage and view all doctors registered in the Hospital Management System.</p>

    <!-- 🔔 Error Message Alert -->
    <div th:if="${errorMessage}" class="alert alert-danger mb-4" th:text="${errorMessage}"></div>

    <div class="table-container-card">
      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Qualification</th>
              <th>Specialization</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="doctor : ${doctors}">
              <td th:text="${doctor.id}" class="text-secondary">1</td>
              <td th:text="${doctor.name}">Dr. Arjun Mehta</td>
              <td th:text="${doctor.email}" class="text-secondary">arjun@example.com</td>
              <td th:text="${doctor.phone}">+91 9876543210</td>
              <td th:text="${doctor.qualification}">MBBS, MD</td>
              <td th:text="${doctor.specialization}">Cardiology</td>
              <td class="text-center">
                <a class="btn btn-sm btn-primary me-1" th:href="@{/doctors/edit/{id}(id=${doctor.id})}">
                  <i class="bi bi-pencil"></i>
                </a>
                <a class="btn btn-sm btn-danger"
                   th:href="@{/doctors/delete/{id}(id=${doctor.id})}"
                   onclick="return confirm('Are you sure you want to delete this doctor?');">
                  <i class="bi bi-trash"></i>
                </a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(doctors)}">
              <td colspan="7" class="text-center text-secondary py-4">
                No doctors found. Click “Add Doctor” to register one.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
