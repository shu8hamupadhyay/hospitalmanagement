<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients List | HMS Admin</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">

    <style>
        /* Theme Variables from Dashboard Template */
        :root {
            --bg-main: #0d1117;
            --bg-card: #1c2128;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-yellow: #e4b01e; /* Used for Warning/Edit buttons */
            --shadow-soft: rgba(56, 139, 253, 0.1);
        }

        * { box-sizing: border-box; }
        a { text-decoration: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-y: hidden; /* Prevent body scroll */
        }

        /* Sidebar Styling (Fixed position) */
        .sidebar {
            width: 250px;
            flex-shrink: 0;
            position: fixed;
            height: 100vh;
            background-color: #161b22; 
            z-index: 1000;
            overflow-y: auto;
        }

        /* Main Content Alignment Fix */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px;
            /* CRITICAL ALIGNMENT: Pushes main content past the fixed sidebar */
            margin-left: 260px; 
            transition: margin-left 0.3s ease;
            background-color: var(--bg-main);
        }

        h1 {
            color: var(--accent-blue);
            font-weight: 700;
        }

        /* Table Styling */
        .table {
            color: var(--text-primary);
        }
        
        /* Darker, defined border between table rows/cells */
        .table-bordered {
            border-color: var(--border-color);
        }

        .table thead {
            background-color: var(--accent-blue); /* Blue header background */
            color: white;
            /* Remove standard border that conflicts with dark theme */
            border-bottom: none; 
        }

        .table tbody tr {
            background-color: var(--bg-card); /* Darker row background */
        }
        
        .table tbody tr td {
             border-color: var(--border-color);
        }

        .table-hover tbody tr:hover {
            background-color: #272d34; /* Slightly lighter hover */
        }

        /* Button Styling */
        .btn {
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            padding: 8px 15px; /* Adjust padding for better look */
        }

        .btn-success {
            background-color: var(--accent-green);
            border: none;
        }
        .btn-success:hover {
            background-color: #359844;
        }

        .btn-warning {
            background-color: var(--accent-yellow); /* Using a new variable for consistency */
            color: #1c2128; /* Dark text for warning button */
            border: none;
        }
        .btn-warning:hover {
            background-color: #c4961d;
        }

        .btn-danger {
            background-color: var(--accent-red);
            border: none;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow-y: auto;
            }
            .main-content {
                margin-left: 0; 
                padding: 20px;
            }
            .sidebar {
                display: none; 
                position: static;
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Fragment Import -->
    <div th:replace="fragments/sidebar :: sidebar" class="sidebar"></div>

<!-- Main Content -->
<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-people"></i> Patients List</h1>
        <a th:href="@{/patients/new}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Add Patient</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Gender</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Placeholder/Example Rows -->
                <tr th:each="patient : ${patients}">
                    <td th:text="${patient.id}">1001</td>
                    <td th:text="${patient.name}">John Doe</td>
                    <td th:text="${patient.email}">john.doe@example.com</td>
                    <td th:text="${patient.phone}">+1 555-1234</td>
                    <td th:text="${patient.gender}">Male</td>
                    <td class="text-center">
                        <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-warning btn-sm">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <!-- Note: In a real app, confirm() should be replaced with a custom modal -->
                        <a th:href="@{/patients/delete/{id}(id=${patient.id})}" class="btn btn-danger btn-sm"
                            onclick="return confirm('Are you sure you want to delete this patient?')">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </td>
                </tr>
                <!-- End Placeholder/Example Rows -->
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
