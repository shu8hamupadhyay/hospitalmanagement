<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients List | HMS Admin</title>

  <!-- Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    /* ================================
       🌙 Modern Dark HMS Theme
    ================================= */
    :root {
      --bg-main: #05070d;
      --bg-card: #10161e;
      --bg-row-hover: #1b2432;
      --border-color: #252c3b;
      --text-primary: #f8f9fa;
      --text-secondary: #aeb8c4;
      --accent-blue: #4fa8ff;
      --accent-green: #3fc76e;
      --accent-yellow: #f0c14b;
      --accent-red: #f85149;
      --shadow-soft: 0 4px 18px rgba(0,0,0,0.6);
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      position: fixed;
      height: 100vh;
      background: linear-gradient(180deg, #0e141d, #0b0f17);
      box-shadow: 2px 0 10px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    /* Main Content */
    .main-content {
      flex-grow: 1;
      margin-left: 250px;
      padding: 40px;
      transition: all 0.3s ease;
    }

    h1 {
      color: var(--accent-blue);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      color: var(--text-secondary);
      margin-bottom: 25px;
    }

    /* Card */
    .list-container {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .list-container:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.7);
    }

    /* Table */
    .table {
      color: var(--text-primary);
      font-size: 0.95rem;
      border-collapse: separate;
      border-spacing: 0 6px;
    }

    .table thead {
      background-color: #151c26;
      color: var(--accent-blue);
      font-weight: 600;
      text-transform: uppercase;
    }

    .table thead th {
      border: none;
      padding: 12px 15px;
    }

    .table tbody tr {
      background-color: #121922;
      border-radius: var(--radius);
      transition: background-color 0.25s ease, transform 0.15s ease;
    }

    .table tbody tr:hover {
      background-color: var(--bg-row-hover);
      box-shadow: inset 3px 0 0 var(--accent-blue);
      transform: scale(1.002);
    }

    .table tbody td {
      padding: 15px;
      border-top: 1px solid var(--border-color);
    }

    .table tbody td.text-secondary {
      color: var(--text-secondary) !important;
    }

    /* Buttons */
    .btn {
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s ease, transform 0.1s ease;
      padding: 6px 12px;
      font-size: 0.88rem;
    }
    .btn:active { transform: translateY(1px); }

    .btn-success {
      background-color: var(--accent-green);
      border-color: var(--accent-green);
      color: #fff;
    }
    .btn-success:hover { background-color: #37a75b; }

    .btn-warning {
      background-color: var(--accent-yellow);
      color: #111;
      border-color: var(--accent-yellow);
    }
    .btn-warning:hover { background-color: #ddb53c; }

    .btn-danger {
      background-color: var(--accent-red);
      border-color: var(--accent-red);
    }
    .btn-danger:hover { background-color: #dc2626; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; padding: 20px; }
      .list-container { padding: 15px; }
      h1 { font-size: 1.4rem; }
      .table-responsive {
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
      }
    }
  </style>
</head>

<body>
  <div th:replace="fragments/sidebar :: sidebar" class="sidebar"></div>

  <main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1><i class="bi bi-people"></i> Patients Management</h1>
      <a th:href="@{/patients/new}" class="btn btn-success">
        <i class="bi bi-plus-circle"></i> Add Patient
      </a>
    </div>

    <p class="subtitle">Manage and view all registered patients within the Hospital Management System.</p>

    <div class="list-container">
      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Gender</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="patient : ${patients}">
              <td th:text="${patient.id}" class="text-secondary">1001</td>
              <td th:text="${patient.name}">John Doe</td>
              <td th:text="${patient.email}" class="text-secondary">john.doe@example.com</td>
              <td th:text="${patient.phone}">+1 555-1234</td>
              <td th:text="${patient.gender}">Male</td>
              <td class="text-center">
                <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-warning btn-sm me-1">
                  <i class="bi bi-pencil"></i> Edit
                </a>
                <a th:href="@{/patients/delete/{id}(id=${patient.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this patient?')">
                  <i class="bi bi-trash"></i> Delete
                </a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(patients)}">
              <td colspan="6" class="text-center text-secondary py-4">
                No patients found. Click “Add Patient” to register one.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
