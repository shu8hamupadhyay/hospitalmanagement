<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Contact</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>

    <!-- Sidebar Styles -->
    <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>

    <style>
        /* 🩺 Dark Background for Main Area */
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: 'Poppins', sans-serif;
            margin: 0;
        }

        /* ✅ Main Content Layout */
        .main-content {
            margin-left: 260px; /* Push beside sidebar */
            padding: 40px;
            transition: all 0.3s ease;
            min-height: 100vh;
            background-color: #0d1117;
        }

        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }

        /* 📋 Form Container */
        .form-container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 10px rgba(255,255,255,0.05);
        }

        label {
            margin-top: 10px;
            font-weight: 500;
        }

        input, select {
            background-color: #0d1117 !important;
            color: #e6edf3 !important;
            border: 1px solid #30363d !important;
        }

        input:focus, select:focus {
            border-color: #1f6feb !important;
            box-shadow: 0 0 4px #1f6feb;
        }

        .btn-primary {
            background-color: #1f6feb;
            border: none;
        }

        .btn-primary:hover {
            background-color: #388bfd;
        }

        .btn-secondary {
            background-color: #21262d;
            color: #e6edf3;
            border: none;
        }

        .btn-secondary:hover {
            background-color: #30363d;
        }
    </style>
</head>
<body>

<!-- ✅ Sidebar Fragment Include -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- ✅ Main Content -->
<main class="main-content">
    <div class="form-container">
        <h2 class="text-center mb-4 text-info">
            <i class="bi bi-person-plus"></i> Add New Contact
        </h2>

        <form th:action="@{/contacts/add}" th:object="${contact}" method="post">
            <div class="mb-3">
                <label for="name">Name:</label>
                <input id="name" type="text" th:field="*{name}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="email">Email:</label>
                <input id="email" type="email" th:field="*{email}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="phone">Phone:</label>
                <input id="phone" type="text" th:field="*{phone}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="company">Company:</label>
                <input id="company" type="text" th:field="*{company}" class="form-control">
            </div>

            <div class="mb-4">
                <label for="category">Category:</label>
                <select id="category" th:field="*{category}" class="form-select" required>
                    <option value="">Select Category</option>
                    <option value="Client">Client</option>
                    <option value="Vendor">Vendor</option>
                    <option value="Partner">Partner</option>
                    <option value="Employee">Employee</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/contacts}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Save Contact
                </button>
            </div>
        </form>
    </div>
</main>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ✅ Sidebar Toggle Script -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("sidebarToggle");
        const sidebar = document.querySelector(".sidebar");

        toggleBtn?.addEventListener("click", () => {
            sidebar.classList.toggle("active");
        });
    });
</script>

</body>
</html>
