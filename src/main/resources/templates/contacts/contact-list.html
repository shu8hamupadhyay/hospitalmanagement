<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Import shared sidebar CSS -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  
  <style>
    /* 📘 Page-specific styles */
    h1 {
      color: #58a6ff;
      font-weight: 600;
    }

    .btn-primary {
      background-color: #1f6feb;
      border: none;
      border-radius: 8px;
      font-weight: 500;
    }

    .btn-primary:hover {
      background-color: #388bfd;
    }

    table {
      width: 100%;
      background-color: #161b22;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
    }

    thead {
      background-color: #1f2937;
    }

    th {
      color: #9ca3af;
      text-transform: uppercase;
      font-size: 13px;
    }

    tbody tr {
      border-bottom: 1px solid #30363d;
    }

    tbody tr:hover {
      background-color: #21262d;
    }

    td a {
      color: #58a6ff;
      text-decoration: none;
      margin-right: 10px;
    }

    td a:hover {
      color: #79c0ff;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .main-content {
        padding: 20px;
      }

      table {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="layout-container">
    <!-- 🧩 Include Sidebar Fragment -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <!-- 🌍 Main Content -->
    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-person-lines-fill"></i> Contacts</h1>
        <a th:href="@{/contacts/add}" class="btn btn-primary">
          <i class="bi bi-plus-circle"></i> Add Contact
        </a>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Company</th>
              <th>Category</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="contact : ${contacts}">
              <td th:text="${contact.name}"></td>
              <td th:text="${contact.email}"></td>
              <td th:text="${contact.phone}"></td>
              <td th:text="${contact.company}"></td>
              <td th:text="${contact.category}"></td>
              <td th:text="${#temporals.format(contact.createdAt, 'dd MMM yyyy')}"></td>
              <td>
                <a th:href="@{'/contacts/view/' + ${contact.id}}"><i class="bi bi-eye"></i> View</a>
                <a th:href="@{'/contacts/edit/' + ${contact.id}}"><i class="bi bi-pencil-square"></i> Edit</a>
                <a th:href="@{'/contacts/delete/' + ${contact.id}}" onclick="return confirm('Are you sure?')">
                  <i class="bi bi-trash"></i> Delete
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
