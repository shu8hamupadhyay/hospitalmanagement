<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMS Admin | Lab Reports</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/css/sidebar.css}" rel="stylesheet"/> <!-- ✅ Sidebar CSS fragment -->

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ✅ Main Content Layout */
    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      background-color: #0d1117;
      padding: 30px;
      margin-left: 260px;
      transition: margin-left 0.3s ease;
    }

    /* ✅ Mobile Sidebar Toggle */
    .toggle-btn {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      background: none;
      border: none;
      color: #fff;
      font-size: 26px;
      z-index: 1100;
      cursor: pointer;
    }

    /* ✅ Section Headings */
    .section-title {
      color: #58a6ff;
      font-weight: 700;
      margin-bottom: 20px;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ✅ Card Box Styling */
    .card-section {
      background-color: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 35px;
      box-shadow: 0 0 15px rgba(56, 139, 253, 0.05);
      transition: 0.3s ease;
    }

    .card-section:hover {
      box-shadow: 0 0 25px rgba(88, 166, 255, 0.1);
    }

    /* ✅ Form Fields */
    .form-control,
    .form-select,
    textarea {
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
    }

    .form-control:focus,
    .form-select:focus,
    textarea:focus {
      border-color: #58a6ff;
      box-shadow: none;
    }

    /* ✅ Buttons */
    .btn-save {
      background-color: #238636;
      color: #fff;
      font-weight: 600;
      border-radius: 8px;
      padding: 10px 20px;
      transition: 0.3s;
      border: none;
    }

    .btn-save:hover {
      background-color: #2ea043;
    }

    .btn-edit {
      background-color: #d29922;
      color: #fff;
      border: none;
    }

    .btn-edit:hover {
      background-color: #e3b341;
    }

    .btn-delete {
      background-color: #f85149;
      color: #fff;
      border: none;
    }

    .btn-delete:hover {
      background-color: #da3633;
    }

    /* ✅ Table Styling */
    .table {
      color: #c9d1d9;
      border-color: #30363d;
    }

    .table thead th {
      background-color: #21262d;
      color: #58a6ff;
      text-align: center;
      font-weight: 600;
    }

    .table tbody td {
      text-align: center;
      vertical-align: middle;
    }

    .table-striped tbody tr:nth-of-type(odd) {
      background-color: #0d1117;
    }

    .table-striped tbody tr:nth-of-type(even) {
      background-color: #161b22;
    }

    /* ✅ Mobile Responsiveness */
    @media (max-width: 768px) {
      .sidebar {
        left: -270px;
      }

      .sidebar.active {
        left: 0;
      }

      .toggle-btn {
        display: block;
      }

      .main-content {
        margin-left: 0;
        padding-top: 70px;
      }

      body.sidebar-open {
        overflow: hidden;
      }
    }
  </style>
</head>

<body>

  <!-- ☰ Toggle Button -->
  <button class="toggle-btn" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <!-- ✅ Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- ✅ Main Content -->
  <main class="main-content">
    <h2 class="section-title"><i class="bi bi-clipboard-data"></i> Lab Reports Management</h2>

    <!-- Add New Report -->
    <div class="card-section">
      <h4 class="mb-3 text-success"><i class="bi bi-file-earmark-plus me-2"></i> Add New Lab Report</h4>
      <form th:action="@{/labreports}" method="post" class="row g-3">
        <div class="col-md-4">
          <label for="testName" class="form-label">Test Name</label>
          <input type="text" name="testName" id="testName" class="form-control" placeholder="e.g., Blood Test, X-Ray" required>
        </div>
        <div class="col-md-4">
          <label for="patientId" class="form-label">Patient ID</label>
          <input type="number" name="patientId" id="patientId" class="form-control" required>
        </div>
        <div class="col-md-4 d-flex align-items-end">
          <button type="submit" class="btn-save w-100"><i class="bi bi-save me-2"></i> Save Report</button>
        </div>
        <div class="col-12">
          <label for="result" class="form-label">Result</label>
          <textarea name="result" id="result" class="form-control" rows="3" placeholder="Enter detailed findings..." required></textarea>
        </div>
        <div class="col-12">
          <label for="notes" class="form-label">Notes</label>
          <textarea name="notes" id="notes" class="form-control" rows="2" placeholder="Doctor's comments or next steps..."></textarea>
        </div>
      </form>
    </div>

    <!-- All Reports Table -->
    <div class="card-section">
      <h4 class="mb-3 text-info"><i class="bi bi-table me-2"></i> All Lab Reports</h4>
      <div class="table-responsive">
        <table class="table table-striped table-bordered table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Test</th>
              <th>Result</th>
              <th>Date</th>
              <th>Notes</th>
              <th>Patient</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="rep : ${labreports}">
              <td th:text="${rep.id}"></td>
              <td th:text="${rep.testName}"></td>
              <td><div class="text-truncate" style="max-width: 200px;" th:text="${rep.result}"></div></td>
              <td th:text="${#temporals.format(rep.reportDate, 'dd-MMM-yyyy HH:mm')}"></td>
              <td><div class="text-truncate" style="max-width: 200px;" th:text="${rep.notes}"></div></td>
              <td th:text="${rep.patient.name}"></td>
              <td>
                <a th:href="@{'/labreports/edit/' + ${rep.id}}" class="btn btn-sm btn-edit me-1"><i class="bi bi-pencil"></i></a>
                <a th:href="@{'/labreports/delete/' + ${rep.id}}" class="btn btn-sm btn-delete"><i class="bi bi-trash"></i></a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const sidebar = document.querySelector('.sidebar');
    const toggleBtn = document.getElementById('sidebarToggle');
    const body = document.body;

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('active');
      body.classList.toggle('sidebar-open');
    });
  </script>
</body>
</html>
