<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add/Edit Prescription | HMS Admin</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Import sidebar CSS -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f1112;
      color: #e5e7eb;
      margin: 0;
      overflow-x: hidden;
    }

    .layout-container {
      display: flex;
      min-height: 100vh;
      transition: all 0.3s ease;
    }

    /* Main content area */
    .main-content {
      flex-grow: 1;
      padding: 40px;
      margin-left: 260px;
      background-color: #1f2937;
      border-top-left-radius: 15px;
      border-bottom-left-radius: 15px;
      transition: all 0.3s ease;
    }

    h1, h2, h4, label {
      color: #60a5fa;
    }

    /* Form card */
    .form-card {
      background-color: #111827;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.05);
      transition: box-shadow 0.3s ease;
    }

    .form-card:hover {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
    }

    /* Form controls */
    .form-control,
    .form-select {
      background-color: #0f172a;
      color: #e5e7eb;
      border: 1px solid #374151;
      border-radius: 6px;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #60a5fa;
      box-shadow: none;
    }

    /* Buttons */
    .btn-success {
      background-color: #2563eb;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      transition: 0.3s;
    }

    .btn-success:hover {
      background-color: #1d4ed8;
    }

    .btn-secondary {
      background-color: #374151;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      padding: 10px 20px;
    }

    .btn-secondary:hover {
      background-color: #4b5563;
    }

    .btn-back {
      background-color: #1e293b;
      color: #60a5fa;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .btn-back:hover {
      background-color: #334155;
      color: #93c5fd;
    }

    /* Toggle button for mobile */
    .toggle-btn {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      background: none;
      border: none;
      color: #e5e7eb;
      font-size: 28px;
      z-index: 1100;
      cursor: pointer;
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      .toggle-btn {
        display: block;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
        padding-top: 70px;
      }

      .sidebar {
        left: -260px;
      }

      .sidebar.active {
        left: 0;
      }

      .sidebar-overlay.active {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 900;
      }
    }
  </style>
</head>

<body>

  <!-- Toggle Sidebar Button (for mobile) -->
  <button class="toggle-btn" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <div class="layout-container">
    <!-- Sidebar Fragment -->
    <aside th:replace="fragments/sidebar :: sidebar"></aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="mb-3">
        <a th:href="@{/prescriptions}" class="btn-back">
          <i class="bi bi-arrow-left"></i> Back to Prescriptions
        </a>
      </div>

      <div class="form-card">
        <h2 th:text="${prescription.id} != null ? 'Edit Prescription' : 'Add Prescription'"></h2>

        <form th:action="@{/prescriptions}" method="post" th:object="${prescription}">
          <input type="hidden" th:field="*{id}" />

          <div class="row g-3 mt-3">
            <div class="col-md-6">
              <label class="form-label">Medicine</label>
              <input type="text" class="form-control" th:field="*{medicine}" required />
            </div>

            <div class="col-md-6">
              <label class="form-label">Dosage</label>
              <input type="text" class="form-control" th:field="*{dosage}" required />
            </div>

            <div class="col-md-6">
              <label class="form-label">Instructions</label>
              <input type="text" class="form-control" th:field="*{instructions}" />
            </div>

            <div class="col-md-6">
              <label class="form-label">Patient</label>
              <select class="form-select" name="patientId" required>
                <option value="">-- Select Patient --</option>
                <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"
                        th:selected="${prescription.patient != null and prescription.patient.id == p.id}"></option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Doctor</label>
              <select class="form-select" name="doctorId" required>
                <option value="">-- Select Doctor --</option>
                <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name}"
                        th:selected="${prescription.doctor != null and prescription.doctor.id == d.id}"></option>
              </select>
            </div>

            <div class="col-12 d-flex justify-content-between mt-4">
              <a th:href="@{/prescriptions}" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-success">Save</button>
            </div>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const toggleBtn = document.getElementById("sidebarToggle");
      const sidebar = document.querySelector(".sidebar");
      const overlay = document.createElement("div");
      overlay.classList.add("sidebar-overlay");
      document.body.appendChild(overlay);

      toggleBtn.addEventListener("click", () => {
        sidebar.classList.toggle("active");
        overlay.classList.toggle("active");
      });

      overlay.addEventListener("click", () => {
        sidebar.classList.remove("active");
        overlay.classList.remove("active");
      });
    });
  </script>
</body>
</html>
