<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add/Edit Prescription</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body { display: flex; height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f4f7f9; }
    .sidebar { width: 250px; background-color: #1e88e5; color: #fff; padding: 20px; flex-shrink: 0; }
    .sidebar h2 { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 30px; }
    .nav-link { color: #e3f2fd; display: flex; align-items: center; gap: 10px; padding: 10px 15px; border-radius: 8px; transition: all 0.2s; text-decoration: none; }
    .nav-link:hover, .nav-link.active { background-color: #1565c0; color: #fff; }
    .main-content { flex-grow: 1; overflow-y: auto; padding: 30px; }
    @media (max-width: 768px) { .sidebar { display: none; } body { flex-direction: column; } }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <h2>🏥 HMS Admin</h2>
  <nav class="nav flex-column">
    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a class="nav-link" th:href="@{/doctors}"><i class="bi bi-person-badge"></i> Doctors</a>
    <a class="nav-link" th:href="@{/patients}"><i class="bi bi-people"></i> Patients</a>
    <a class="nav-link" th:href="@{/appointments}"><i class="bi bi-calendar-event"></i> Appointments</a>
    <a class="nav-link" th:href="@{/bills}"><i class="bi bi-cash-coin"></i> Bills</a>
    <a class="nav-link active" th:href="@{/prescriptions}"><i class="bi bi-capsule"></i> Prescriptions</a>
    <a class="nav-link" th:href="@{/labreports}"><i class="bi bi-beaker"></i> Lab Reports</a>
  </nav>
</aside>

<!-- Main Content -->
<main class="main-content">
  <h1 class="text-primary mb-4" th:text="${prescription.id} != null ? 'Edit Prescription' : 'Add Prescription'"></h1>

  <form th:action="@{/prescriptions}" method="post" th:object="${prescription}">
    <input type="hidden" th:field="*{id}" />

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Medicine</label>
        <input type="text" class="form-control" th:field="*{medicine}" required />
      </div>

      <div class="col-md-6">
        <label class="form-label">Dosage</label>
        <input type="text" class="form-control" th:field="*{dosage}" required />
      </div>

      <div class="col-md-6">
        <label class="form-label">Instructions</label>
        <input type="text" class="form-control" th:field="*{instructions}" />
      </div>

      <div class="col-md-6">
        <label class="form-label">Patient</label>
        <select class="form-select" name="patientId" required>
          <option value="">-- Select Patient --</option>
          <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}" 
                  th:selected="${prescription.patient != null and prescription.patient.id == p.id}"></option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Doctor</label>
        <select class="form-select" name="doctorId" required>
          <option value="">-- Select Doctor --</option>
          <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name}" 
                  th:selected="${prescription.doctor != null and prescription.doctor.id == d.id}"></option>
        </select>
      </div>

      <div class="col-12 d-flex justify-content-between mt-4">
        <a th:href="@{/prescriptions}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-success">Save</button>
      </div>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
