<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${room.id} != null ? 'Edit Room Allotment' : 'Add Room Allotment'"></title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    /* Main Content Area */
    .main-content {
      margin-left: 260px; /* ✅ Pushes content beside sidebar */
      flex-grow: 1;
      overflow-y: auto;
      padding: 40px;
      background-color: #0d1117;
      transition: margin-left 0.3s ease;
      min-height: 100vh;
    }

    /* When Sidebar is Hidden (Mobile) */
    .sidebar.active + .main-content {
      margin-left: 0;
    }

    .form-container {
      background-color: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(56, 139, 253, 0.05);
      max-width: 900px;
      margin: 0 auto;
      padding: 35px;
    }

    h2 {
      color: #58a6ff;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .form-control, .form-select {
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
      transition: all 0.3s ease;
    }

    .form-control::placeholder,
    .form-select option {
      color: #9ba6b2;
    }

    .form-control:focus, .form-select:focus {
      border-color: #58a6ff;
      box-shadow: none;
      background-color: #0d1117;
    }

    label {
      font-weight: 500;
      color: #e6edf3;
    }

    .btn {
      border-radius: 8px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-success {
      background-color: #238636;
      border-color: #238636;
    }

    .btn-success:hover {
      background-color: #2ea043;
      border-color: #2ea043;
    }

    .btn-secondary {
      background-color: #30363d;
      border: none;
      color: #fff;
    }

    .btn-secondary:hover {
      background-color: #484f58;
    }

    .btn-outline-light {
      border-color: #444c56;
      color: #e6edf3;
    }

    .btn-outline-light:hover {
      background-color: #30363d;
      color: #fff;
    }

    /* Responsive Fix */
    @media (max-width: 768px) {
      .main-content {
        margin-left: 0; /* ✅ No offset when sidebar hidden */
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="d-flex align-items-center mb-4">
      <button class="toggle-btn d-md-none me-3" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>
      <a th:href="@{/rooms}" class="btn btn-outline-light btn-sm me-3">
        <i class="bi bi-arrow-left"></i> Back
      </a>
      <h2 th:text="${room.id} != null ? 'Edit Room Allotment' : 'Add Room Allotment'"></h2>
    </div>

    <div class="form-container">
      <form th:action="${room.id} != null ? @{/rooms/update/{id}(id=${room.id})} : @{/rooms}" 
            method="post" class="row g-4">

        <div class="col-md-4">
          <label class="form-label">Room Number</label>
          <input type="text" class="form-control" name="roomNumber" th:value="${room.roomNumber}" required />
        </div>

        <div class="col-md-4">
          <label class="form-label">Patient Name</label>
          <input type="text" class="form-control" name="patientName" th:value="${room.patientName}" required />
        </div>

        <div class="col-md-4">
          <label class="form-label">Room Type</label>
          <select class="form-select" name="roomType" required>
            <option value="General" th:selected="${room.roomType == 'General'}">General</option>
            <option value="Private" th:selected="${room.roomType == 'Private'}">Private</option>
            <option value="ICU" th:selected="${room.roomType == 'ICU'}">ICU</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label">Doctor In Charge</label>
          <input type="text" class="form-control" name="doctorInCharge" th:value="${room.doctorInCharge}" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Admission Date</label>
          <input type="date" class="form-control" name="admissionDate" th:value="${room.admissionDate}" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Discharge Date</label>
          <input type="date" class="form-control" name="dischargeDate" th:value="${room.dischargeDate}" />
        </div>

        <div class="col-md-4">
          <label class="form-label">Status</label>
          <select class="form-select" name="status" required>
            <option value="Occupied" th:selected="${room.status == 'Occupied'}">Occupied</option>
            <option value="Available" th:selected="${room.status == 'Available'}">Available</option>
            <option value="Cleaning" th:selected="${room.status == 'Cleaning'}">Cleaning</option>
          </select>
        </div>

        <div class="col-12 d-flex justify-content-between pt-4">
          <a th:href="@{/rooms}" class="btn btn-secondary">
            <i class="bi bi-x-circle me-1"></i> Cancel
          </a>
          <button type="submit" class="btn btn-success">
            <i class="bi bi-check-circle me-1"></i> Save
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Sidebar Toggle Script -->
  <script>
    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      sidebar.classList.toggle('active');
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
