<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Allotments</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>

  <!-- Shared Sidebar Styles -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>

  <style>
    /* ================================
       🌙 DARK THEME PAGE STYLES
    ================================ */
    :root {
      --bg-main: #121212;
      --bg-card: #212121;
      --border-color: #3a3a3a;
      --text-primary: #f1f1f1;
      --text-secondary: #b0bec5;
      --accent-teal: #00bcd4;
      --hover-dark: #2a2a2a;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      margin: 0;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ================================
       📊 MAIN CONTENT
    ================================ */
    .main-content {
      margin-left: 260px; /* ✅ Offset for fixed sidebar */
      flex-grow: 1;
      overflow-y: auto;
      padding: 40px;
      background-color: var(--bg-main);
      transition: margin-left 0.3s ease;
      min-height: 100vh;
    }

    /* When sidebar is collapsed (mobile toggle) */
    .sidebar.active + .main-content {
      margin-left: 0;
    }

    h1 {
      color: var(--accent-teal);
      font-weight: 700;
    }

    /* ================================
       🧾 TABLE STYLING
    ================================ */
    .table {
      color: var(--text-primary);
      background-color: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .table thead {
      background-color: #1e1e1e;
      border-bottom: 2px solid var(--accent-teal);
    }

    .table th, .table td {
      background-color: var(--bg-card);
      border-color: #3a3a3a;
      vertical-align: middle;
    }

    .table tbody tr:hover td {
      background-color: var(--hover-dark) !important;
      cursor: pointer;
    }

    /* ================================
       🧩 BUTTONS
    ================================ */
    .btn {
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-success {
      background-color: var(--accent-teal);
      border-color: var(--accent-teal);
    }

    .btn-success:hover {
      background-color: #0097a7;
      border-color: #0097a7;
    }

    .btn-warning {
      background-color: #ffc107;
      border-color: #ffc107;
      color: #121212;
    }

    .btn-danger {
      background-color: #dc3545;
      border-color: #dc3545;
    }

    /* ================================
       📱 MOBILE RESPONSIVENESS
    ================================ */
    @media (max-width: 768px) {
      .main-content {
        margin-left: 0; /* ✅ Remove offset when sidebar hidden */
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <!-- ✅ Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- ✅ Main Content -->
  <main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center">
        <button class="toggle-btn d-md-none me-3" onclick="toggleSidebar()">
          <i class="bi bi-list text-light fs-3"></i>
        </button>
        <h1><i class="bi bi-door-open me-2"></i>Room Allotments</h1>
      </div>
      <a th:href="@{/rooms/new}" class="btn btn-success shadow-sm">
        <i class="bi bi-plus-circle me-2"></i>Allot New Room
      </a>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Room No.</th>
            <th>Patient</th>
            <th>Room Type</th>
            <th>Doctor</th>
            <th>Admission</th>
            <th>Discharge</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="room : ${rooms}">
            <td th:text="${room.id}"></td>
            <td th:text="${room.roomNumber}"></td>
            <td th:text="${room.patientName}"></td>
            <td>
              <span class="badge"
                    th:text="${room.roomType}"
                    th:classappend="${room.roomType == 'ICU'} ? 'bg-danger' : 
                                   (${room.roomType == 'Private'} ? 'bg-info' : 'bg-secondary')"></span>
            </td>
            <td th:text="${room.doctorInCharge}"></td>
            <td th:text="${room.admissionDate}"></td>
            <td th:text="${room.dischargeDate}"></td>
            <td>
              <span class="badge"
                    th:text="${room.status}"
                    th:classappend="${room.status == 'Occupied'} ? 'bg-warning text-dark' : 
                                   (${room.status == 'Available'} ? 'bg-success' : 'bg-secondary')"></span>
            </td>
            <td class="text-center">
              <a th:href="@{/rooms/edit/{id}(id=${room.id})}" class="btn btn-warning btn-sm" title="Edit">
                <i class="bi bi-pencil"></i>
              </a>
              <a th:href="@{/rooms/delete/{id}(id=${room.id})}" 
                 class="btn btn-danger btn-sm"
                 onclick="return confirm('Are you sure you want to delete this allotment?')" 
                 title="Delete">
                 <i class="bi bi-trash"></i>
              </a>
            </td>
          </tr>

          <!-- If no data -->
          <tr th:if="${#lists.isEmpty(rooms)}">
            <td colspan="9" class="text-center text-secondary py-4">
              No room allotments found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      sidebar.classList.toggle('active');
      document.body.classList.toggle('sidebar-open');
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
