<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMS Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background-color: #161b22;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px 15px;
      flex-shrink: 0;
      border-right: 1px solid #30363d;
    }

    .sidebar h2 {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 30px;
      color: #58a6ff;
    }

    .nav-link {
      color: #c9d1d9;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      border-radius: 8px;
      transition: all 0.2s ease-in-out;
      font-weight: 500;
    }

    .nav-link:hover,
    .nav-link.active {
      background-color: #238636;
      color: #fff;
    }

    .nav-link i {
      font-size: 1.2rem;
    }

    /* Main Content */
    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 30px;
      background-color: #0d1117;
    }

    .main-content h2 {
      color: #58a6ff;
    }

    /* Cards */
    .card {
      border: none;
      border-radius: 12px;
      background-color: #161b22;
      padding: 20px;
      margin-bottom: 20px;
      transition: transform 0.3s, box-shadow 0.3s;
      height: 100%;
      box-shadow: 0 0 15px rgba(56, 139, 253, 0.05);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 20px rgba(88, 166, 255, 0.15);
    }

    .card h5 {
      color: #8b949e;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card h2 {
      font-weight: 700;
      font-size: 2rem;
      margin-top: 10px;
    }

    .card.doctor-card h2 { color: #58a6ff; }
    .card.patient-card h2 { color: #3fb950; }
    .card.appointment-card h2 { color: #d29922; }
    .card.revenue-card h2 { color: #f85149; }

    /* Table Section */
    .card.table-section {
      background-color: #161b22;
      border: 1px solid #21262d;
    }

    .table {
      color: #c9d1d9;
      border-color: #30363d;
    }

    .table thead {
      background-color: #21262d;
      color: #58a6ff;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      body { flex-direction: column; }
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>🏥 HMS Admin</h2>
    <nav class="nav flex-column">
      <a class="nav-link active" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a class="nav-link" th:href="@{/doctors}"><i class="bi bi-person-badge"></i> Doctors</a>
      <a class="nav-link" th:href="@{/patients}"><i class="bi bi-people"></i> Patients</a>
      <a class="nav-link" th:href="@{/appointments}"><i class="bi bi-calendar-event"></i> Appointments</a>
      <a class="nav-link" th:href="@{/bills}"><i class="bi bi-cash-coin"></i> Bills</a>
      <a class="nav-link" th:href="@{/prescriptions}"><i class="bi bi-capsule"></i> Prescriptions</a>
      <a class="nav-link" th:href="@{/labreports}"><i class="bi bi-beaker"></i> Lab Reports</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <h2 class="mb-4 fw-bold">Dashboard Overview</h2>

    <div class="row g-4">
      <div class="col-lg-3 col-md-6">
        <div class="card text-center doctor-card">
          <h5>Total Doctors</h5>
          <h2 th:text="${doctorCount}">0</h2>
        </div>
      </div>

      <div class="col-lg-3 col-md-6">
        <div class="card text-center patient-card">
          <h5>Total Patients</h5>
          <h2 th:text="${patientCount}">0</h2>
        </div>
      </div>

      <div class="col-lg-3 col-md-6">
        <div class="card text-center appointment-card">
          <h5>Appointments Today</h5>
          <h2 th:text="${appointmentCount}">0</h2>
        </div>
      </div>

      <div class="col-lg-3 col-md-6">
        <div class="card text-center revenue-card">
          <h5>Total Revenue</h5>
          <h2 th:text="'$' + ${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 2, 'POINT')}">$0.00</h2>
        </div>
      </div>
    </div>

    <div class="row mt-4">
      <div class="col-12">
        <div class="card table-section p-4">
          <h4 class="mb-3" style="color:#58a6ff;">Upcoming Appointments</h4>
          <table class="table table-bordered table-hover">
            <thead>
              <tr>
                <th>Patient</th>
                <th>Doctor</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="appointment : ${appointments}">
                <td th:text="${appointment.patient.name}">John Doe</td>
                <td th:text="${appointment.doctor.name}">Dr. Smith</td>
                <td th:text="${appointment.date}">2025-10-22</td>
                <td th:text="${appointment.time}">10:00 AM</td>
                <td th:text="${appointment.status}">Confirmed</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
