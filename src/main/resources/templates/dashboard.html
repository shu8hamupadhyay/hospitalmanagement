<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏥 HMS Dashboard</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />

  <style>
    :root {
      --bg-main: #0d1117;
      --bg-card: #161b22;
      --bg-highlight: #1c2128;
      --border-color: #2b3139;
      --text-primary: #e6edf3;
      --text-secondary: #9ba1a8;
      --accent-blue: #4dabf7;
      --accent-green: #3fb950;
      --accent-yellow: #e3b341;
      --accent-red: #f85149;
      --shadow-glow: rgba(77, 171, 247, 0.25);
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .main-content {
      flex-grow: 1;
      padding: 40px;
      margin-left: 260px;
      transition: margin-left 0.3s ease;
    }

    h2 {
      color: var(--accent-blue);
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    /* Cards */
    .stat-card {
      border: none;
      border-radius: 18px;
      padding: 28px 20px;
      background: linear-gradient(145deg, #14191f, #1b2129);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease-in-out;
    }

    .stat-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 20px var(--shadow-glow);
    }

    .stat-card h5 {
      font-size: 0.85rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .stat-card h2 {
      font-weight: 800;
      font-size: 2.1rem;
      margin: 0;
    }

    .doctor-card h2 { color: var(--accent-blue); }
    .patient-card h2 { color: var(--accent-green); }
    .appointment-card h2 { color: var(--accent-yellow); }
    .revenue-card h2 { color: var(--accent-red); }

    /* Tabs */
    .card {
      border: none;
      border-radius: 18px;
      background-color: var(--bg-card);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .nav-tabs {
      border-bottom: 2px solid var(--border-color);
    }

    .nav-tabs .nav-link {
      color: var(--text-secondary);
      font-weight: 600;
      border: none;
      padding: 10px 20px;
      border-radius: 10px 10px 0 0;
      background: transparent;
      transition: all 0.25s;
    }

    .nav-tabs .nav-link:hover {
      color: var(--accent-blue);
    }

    .nav-tabs .nav-link.active {
      color: #fff;
      background-color: var(--accent-blue);
      box-shadow: 0 0 12px var(--shadow-glow);
    }

    /* Table */
    .table {
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .table thead {
      background-color: var(--bg-highlight);
      color: var(--accent-blue);
      font-weight: 600;
    }

    .table tbody tr {
      transition: all 0.2s ease;
    }

    .table tbody tr:hover {
      background-color: #1e242d;
      transform: scale(1.01);
    }

    .badge {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
    }

    @media (max-width: 992px) {
      .main-content {
        margin-left: 0;
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- Main -->
  <main class="main-content">
    <button id="sidebarToggle" class="d-lg-none btn btn-outline-light mb-3">
      <i class="bi bi-list"></i> Menu
    </button>

    <h2><i class="bi bi-speedometer2 me-2"></i> Dashboard Overview</h2>

    <!-- Summary Cards -->
    <div class="row g-4 mb-4">
      <div class="col-lg-3 col-md-6">
        <div class="stat-card text-center doctor-card">
          <h5>Total Doctors</h5>
          <h2 th:text="${doctorCount}">0</h2>
        </div>
      </div>
      <div class="col-lg-3 col-md-6">
        <div class="stat-card text-center patient-card">
          <h5>Total Patients</h5>
          <h2 th:text="${patientCount}">0</h2>
        </div>
      </div>
      <div class="col-lg-3 col-md-6">
        <div class="stat-card text-center appointment-card">
          <h5>Appointments Today</h5>
          <h2 th:text="${appointmentCount}">0</h2>
        </div>
      </div>
      <div class="col-lg-3 col-md-6">
        <div class="stat-card text-center revenue-card">
          <h5>Total Revenue</h5>
          <h2 th:text="'₹' + ${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 2, 'POINT')}">₹0.00</h2>
        </div>
      </div>
    </div>

    <!-- Appointments Section -->
    <div class="card p-4">
      <ul class="nav nav-tabs mb-3" id="appointmentTabs">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#upcoming">Upcoming</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#recent">Recent</button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- Upcoming Appointments -->
        <div class="tab-pane fade show active" id="upcoming">
          <table class="table table-hover align-middle">
            <thead>
              <tr><th>Token</th><th>Patient</th><th>Doctor</th><th>Date & Time</th><th>Status</th></tr>
            </thead>
            <tbody>
              <tr th:each="a : ${upcomingAppointments}">
                <td th:text="${a.serialNo}">A-001</td>
                <td th:text="${a.patient.name}">John</td>
                <td th:text="${a.doctor.name}">Dr. Khan</td>
                <td th:text="${#temporals.format(a.appointmentDate, 'dd-MM-yyyy HH:mm')}">2025-10-22 10:00</td>
                <td>
                  <span th:classappend="'badge ' + 
                    (${a.status == 'Active'} ? 'bg-success' :
                    (${a.status == 'Completed'} ? 'bg-primary' :
                    (${a.status == 'Cancelled'} ? 'bg-danger' : 'bg-secondary')))"
                    th:text="${a.status}">
                  </span>
                </td>
              </tr>
              <tr th:if="${upcomingAppointments == null or upcomingAppointments.size() == 0}">
                <td colspan="5" class="text-center text-secondary py-3">No upcoming appointments.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Recent Appointments -->
        <div class="tab-pane fade" id="recent">
          <table class="table table-hover align-middle">
            <thead>
              <tr><th>Token</th><th>Patient</th><th>Doctor</th><th>Date & Time</th><th>Status</th></tr>
            </thead>
            <tbody>
              <tr th:each="a : ${recentAppointments}">
                <td th:text="${a.serialNo}">A-001</td>
                <td th:text="${a.patient.name}">John</td>
                <td th:text="${a.doctor.name}">Dr. Khan</td>
                <td th:text="${#temporals.format(a.appointmentDate, 'dd-MM-yyyy HH:mm')}">2025-10-22 10:00</td>
                <td>
                  <span th:classappend="'badge ' + 
                    (${a.status == 'Active'} ? 'bg-success' :
                    (${a.status == 'Completed'} ? 'bg-primary' :
                    (${a.status == 'Cancelled'} ? 'bg-danger' : 'bg-secondary')))"
                    th:text="${a.status}">
                  </span>
                </td>
              </tr>
              <tr th:if="${recentAppointments == null or recentAppointments.size() == 0}">
                <td colspan="5" class="text-center text-secondary py-3">No recent appointments.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
