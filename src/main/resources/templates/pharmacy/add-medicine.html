<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${formTitle}">Add Medicine</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Shared Sidebar Styles -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>

  <style>
    /* 🌙 Dark Theme */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #121212;
      color: #f1f1f1;
      display: flex;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* 🧭 Main Content Alignment */
    .main-content {
      flex-grow: 1;
      padding: 40px;
      background-color: #181818;
      transition: all 0.3s ease;
      margin-left: 260px; /* match sidebar width */
      width: calc(100% - 260px);
      overflow-y: auto;
    }

    /* 🧾 Form Card */
    .card {
      background-color: #212121;
      border: 1px solid #2c2c2c;
      color: #fff;
      border-radius: 10px;
    }

    .form-control,
    .form-select {
      background-color: #2b2b2b;
      color: #fff;
      border: 1px solid #3a3a3a;
    }

    .form-control::placeholder {
      color: #9e9e9e;
    }

    .form-control:focus,
    .form-select:focus {
      background-color: #2b2b2b;
      border-color: #00bcd4;
      box-shadow: 0 0 0 0.2rem rgba(0, 188, 212, 0.25);
    }

    .btn {
      border-radius: 30px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-success {
      background-color: #00bcd4;
      border-color: #00bcd4;
    }

    .btn-success:hover {
      background-color: #0097a7;
    }

    .btn-secondary {
      background-color: #424242;
      border-color: #424242;
    }

    .btn-secondary:hover {
      background-color: #616161;
    }

    /* 🍔 Mobile Toggle */
    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: #00bcd4;
      font-size: 1.8rem;
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1100;
    }

    /* 🔳 Sidebar Overlay */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    /* 📱 Responsive Adjustments */
    @media (max-width: 992px) {
      .main-content {
        margin-left: 0;
        width: 100%;
        padding: 20px;
      }

      .mobile-toggle {
        display: block;
      }

      .sidebar {
        left: -260px;
        position: fixed;
        top: 0;
        height: 100%;
        z-index: 1000;
        transition: all 0.3s ease;
      }

      .sidebar.active {
        left: 0;
      }

      body.sidebar-open {
        overflow: hidden;
      }
    }

    /* small devices (better spacing) */
    @media (max-width: 576px) {
      .card {
        padding: 1rem !important;
      }

      h2 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<body>
  <!-- 🍔 Mobile Sidebar Toggle -->
  <button class="mobile-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <!-- 🌫️ Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- 🧭 Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- 🧾 Main Content -->
  <main class="main-content">
    <div class="container">
      <div class="card shadow p-4">
        <h2 class="mb-4 text-center" th:text="${formTitle}">Add Medicine</h2>

        <form th:action="${formAction}" th:object="${medicine}" method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Medicine Name</label>
              <input type="text" class="form-control" th:field="*{name}" placeholder="Enter name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Manufacturer</label>
              <input type="text" class="form-control" th:field="*{manufacturer}" placeholder="Enter manufacturer">
            </div>
            <div class="col-md-6">
              <label class="form-label">Batch Number</label>
              <input type="text" class="form-control" th:field="*{batchNumber}" placeholder="Enter batch number">
            </div>
            <div class="col-md-6">
              <label class="form-label">Expiry Date</label>
              <input type="date" class="form-control" th:field="*{expiryDate}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Composition</label>
              <input type="text" class="form-control" th:field="*{composition}" placeholder="Enter composition">
            </div>
            <div class="col-md-6">
              <label class="form-label">Type</label>
              <input type="text" class="form-control" th:field="*{type}" placeholder="Tablet, Syrup, etc.">
            </div>
            <div class="col-md-6">
              <label class="form-label">Price (₹)</label>
              <input type="number" step="0.01" class="form-control" th:field="*{price}" placeholder="Enter price">
            </div>
            <div class="col-md-6">
              <label class="form-label">Stock Quantity</label>
              <input type="number" class="form-control" th:field="*{stockQuantity}" placeholder="Enter quantity">
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Enter description"></textarea>
            </div>
          </div>

          <div class="d-flex justify-content-between mt-4 flex-wrap gap-2">
            <a href="/pharmacy/medicines" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
            <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Save Medicine</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 🧠 Sidebar Toggle Script -->
  <script>
    const toggleBtn = document.getElementById("sidebarToggle");
    const sidebar = document.querySelector(".sidebar");
    const overlay = document.getElementById("sidebarOverlay");

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("active");
      overlay.classList.toggle("active");
      document.body.classList.toggle("sidebar-open");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
      document.body.classList.remove("sidebar-open");
    });
  </script>
</body>
</html>
