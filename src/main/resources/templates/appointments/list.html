<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏥 Appointments | Hospital Management</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Sidebar Shared Styles -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    :root {
      --bg-dark: #0f0f10;
      --bg-card: #1a1a1c;
      --gold: #d4af37;
      --text-light: #f3f3f3;
      --text-muted: #b3b3b3;
      --border-dark: #2a2a2d;
      --sidebar-width: 260px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      margin: 0;
    }

    /* 🌟 Layout structure */
    .layout-container {
      display: flex;
      width: 100%;
    }

    .sidebar {
      width: var(--sidebar-width);
      background-color: #151515;
      border-right: 1px solid var(--border-dark);
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .main-content {
      flex-grow: 1;
      margin-left: var(--sidebar-width);
      padding: 40px;
      min-height: 100vh;
      background-color: var(--bg-dark);
      transition: margin-left 0.3s ease;
    }

    /* 🌟 Page styling */
    h2 {
      color: var(--gold);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-new {
      background: var(--gold);
      color: black;
      border: none;
      font-weight: 600;
      border-radius: 8px;
      padding: 8px 16px;
      transition: 0.3s;
    }

    .btn-new:hover {
      background-color: #c9a434;
      transform: translateY(-1px);
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.1);
      margin-bottom: 20px;
    }

    .table {
      color: var(--text-light);
    }

    .table th {
      background-color: var(--gold);
      color: black;
      text-align: center;
      vertical-align: middle;
    }

    .table td {
      vertical-align: middle;
    }

    .badge {
      font-size: 0.85rem;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .bg-success { background-color: #2ecc71 !important; }
    .bg-primary { background-color: #3498db !important; }
    .bg-danger { background-color: #e74c3c !important; }
    .bg-secondary { background-color: #7f8c8d !important; }

    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .form-control,
    .form-select {
      background-color: #111;
      color: var(--text-light);
      border: 1px solid #333;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 5px var(--gold);
      background-color: #151515;
    }

    .btn-primary {
      background-color: var(--gold);
      color: black;
      border: none;
    }

    .btn-primary:hover {
      background-color: #caa632;
    }

    .empty {
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }

    .action-buttons a {
      margin-right: 6px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    /* 🔘 Mobile toggle */
    .sidebar-toggle {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      background: var(--gold);
      color: black;
      border: none;
      border-radius: 6px;
      z-index: 1100;
      font-size: 1.2rem;
      padding: 6px 10px;
    }

    @media (max-width: 992px) {
      .sidebar {
        transform: translateX(-100%);
        position: fixed;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .sidebar-toggle {
        display: block;
      }
    }
  </style>
</head>

<body>
  <div class="layout-container">
    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" id="sidebarToggle">
      <i class="bi bi-list"></i>
    </button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar" th:replace="fragments/sidebar :: sidebar"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header">
        <h2><i class="bi bi-calendar2-week"></i> Appointment Dashboard</h2>
        <a th:href="@{/appointments/new}" class="btn btn-new">
          <i class="bi bi-plus-circle me-1"></i> Add Appointment
        </a>
      </div>

      <!-- Filter Bar -->
      <div class="card mb-3 shadow-sm">
        <div class="card-body filter-bar">
          <input id="searchInput" class="form-control" style="max-width:250px;" placeholder="Search patient or doctor...">
          <select id="statusFilter" class="form-select" style="max-width:180px;">
            <option value="">All Status</option>
            <option>Active</option>
            <option>Completed</option>
            <option>Cancelled</option>
          </select>
          <button class="btn btn-primary" onclick="applyFilters()"><i class="bi bi-filter"></i> Filter</button>
          <button class="btn btn-outline-light" onclick="resetFilters()"><i class="bi bi-arrow-repeat"></i> Reset</button>
        </div>
      </div>

      <!-- Appointment List -->
      <div class="card shadow-sm">
        <div class="card-body p-0">
          <table class="table table-bordered table-hover align-middle mb-0" id="appointmentTable">
            <thead>
              <tr>
                <th>Token</th>
                <th>Patient</th>
                <th>Department</th>
                <th>Doctor</th>
                <th>Problem</th>
                <th>Date & Time</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="appt : ${appointments}">
                <td th:text="${appt.serialNo}">CAR-001</td>
                <td th:text="${appt.patient.name}">Anita Verma</td>
                <td th:text="${appt.department.name}">Cardiology</td>
                <td th:text="${appt.doctor.name}">Dr. Ayesha Khan</td>
                <td th:text="${appt.problem}">Chest Pain</td>
                <td th:text="${#temporals.format(appt.appointmentDate, 'dd-MM-yyyy HH:mm')}">2025-11-09 09:30</td>
                <td>
                  <span th:classappend="${appt.status == 'Active' ? 'badge bg-success' :
                                        (appt.status == 'Completed' ? 'badge bg-primary' :
                                        (appt.status == 'Cancelled' ? 'badge bg-danger' : 'badge bg-secondary'))}"
                        th:text="${appt.status}">
                  </span>
                </td>
                <td class="text-center action-buttons">
                  <a th:href="@{'/appointments/edit/' + ${appt.id}}" class="btn btn-sm btn-warning" title="Edit">
                    <i class="bi bi-pencil-square"></i>
                  </a>
                  <a th:href="@{'/appointments/delete/' + ${appt.id}}" class="btn btn-sm btn-danger" title="Delete"
                     onclick="return confirm('Are you sure you want to delete this appointment?')">
                    <i class="bi bi-trash"></i>
                  </a>
                </td>
              </tr>

              <tr th:if="${appointments == null or appointments.size() == 0}">
                <td colspan="8" class="empty">No upcoming appointments found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Sidebar Toggle JS -->
  <script>
    const sidebar = document.getElementById('sidebar');
    const toggle = document.getElementById('sidebarToggle');
    toggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });
  </script>

  <!-- Filtering Logic -->
  <script>
    function applyFilters() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const status = document.getElementById("statusFilter").value;
      const rows = document.querySelectorAll("#appointmentTable tbody tr");

      rows.forEach(row => {
        const patient = row.cells[1]?.innerText.toLowerCase() || '';
        const doctor = row.cells[3]?.innerText.toLowerCase() || '';
        const apptStatus = row.cells[6]?.innerText.trim() || '';

        const matchesSearch = search === '' || patient.includes(search) || doctor.includes(search);
        const matchesStatus = status === '' || apptStatus === status;

        row.style.display = (matchesSearch && matchesStatus) ? '' : 'none';
      });
    }

    function resetFilters() {
      document.getElementById("searchInput").value = '';
      document.getElementById("statusFilter").value = '';
      applyFilters();
    }
  </script>
</body>
</html>
