<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMS Admin | All Bills</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/css/sidebar.css}" rel="stylesheet"/>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      background-color: #0d1117;
      padding: 30px;
      margin-left: 260px;
      transition: margin-left 0.3s ease;
    }

    .toggle-btn {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      background: none;
      border: none;
      color: #fff;
      font-size: 26px;
      z-index: 1100;
      cursor: pointer;
    }

    .section-title {
      color: #3fb950;
      font-weight: 700;
      margin-bottom: 25px;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-section {
      background-color: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 35px;
      box-shadow: 0 0 15px rgba(56, 139, 253, 0.05);
    }

    .table {
      color: #c9d1d9;
      border-color: #30363d;
    }

    .table thead th {
      background-color: #1e2631;
      color: #58a6ff;
      font-weight: 600;
      text-align: center;
    }

    .table tbody tr:hover {
      background-color: #21262d;
      transition: 0.3s;
    }

    .table tbody td {
      text-align: center;
      vertical-align: middle;
    }

    .btn {
      border-radius: 6px;
      font-weight: 500;
    }

    .btn-success { background-color: #238636; border: none; }
    .btn-success:hover { background-color: #2ea043; }

    .btn-primary { background-color: #1f6feb; border: none; }
    .btn-primary:hover { background-color: #388bfd; }

    .btn-warning { background-color: #f0ad4e; border: none; color: #000; }
    .btn-warning:hover { background-color: #e0a800; }

    .btn-danger { background-color: #f85149; border: none; }
    .btn-danger:hover { background-color: #da3633; }

    .btn-outline-light { color: #c9d1d9; border-color: #c9d1d9; }
    .btn-outline-light:hover { background-color: #c9d1d9; color: #0d1117; }

    input[type="file"] {
      color: #c9d1d9;
      background: none;
      border: none;
    }

    @media (max-width: 768px) {
      .sidebar { left: -270px; }
      .sidebar.active { left: 0; }
      .toggle-btn { display: block; }
      .main-content { margin-left: 0; padding-top: 70px; }
      .table-responsive { overflow-x: auto; }
    }
  </style>
</head>

<body>
  <!-- ☰ Toggle Button -->
  <button class="toggle-btn" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <!-- ✅ Sidebar -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- ✅ Main Content -->
  <main class="main-content">
    <h2 class="section-title"><i class="bi bi-receipt"></i> Bills Management</h2>

    <div class="card-section">
      <!-- Header Actions -->
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h4 class="text-info"><i class="bi bi-file-earmark-text me-2"></i> All Bills</h4>

        <div class="d-flex gap-2 flex-wrap">
          <!-- Import Excel -->
          <form th:action="@{/bills/import}" method="post" enctype="multipart/form-data" class="d-flex align-items-center gap-2">
            <input type="file" name="file" accept=".xlsx" required>
            <button type="submit" class="btn btn-outline-light btn-sm">
              <i class="bi bi-upload"></i> Import
            </button>
          </form>

          <!-- Export Excel -->
          <a th:href="@{/bills/export}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-download"></i> Export
          </a>

          <!-- Create New Bill -->
          <a th:href="@{/bills/new}" class="btn btn-success btn-sm">
            <i class="bi bi-plus-circle"></i> New Bill
          </a>
        </div>
      </div>

      <!-- Bills Table -->
      <div class="table-responsive">
        <table class="table table-striped table-bordered table-hover align-middle">
          <thead>
            <tr>
              <th>#</th>
              <th>Invoice No</th>
              <th>Patient</th>
              <th>Doctor</th>
              <th>Date</th>
              <th>Grand Total (₹)</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr th:if="${#lists.isEmpty(bills)}">
              <td colspan="7" class="text-center text-muted">No bills available.</td>
            </tr>

            <tr th:each="bill, iter : ${bills}">
              <td th:text="${iter.index + 1}"></td>
              <td th:text="${bill.invoiceNumber}"></td>
              <td th:text="${bill.patient?.name ?: 'N/A'}"></td>
              <td th:text="${bill.doctor?.name ?: 'N/A'}"></td>
              <td th:text="${bill.billDate != null ? #temporals.format(bill.billDate, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
              <td th:text="${bill.grandTotal != null ? bill.grandTotal : '0.00'}"></td>
              <td class="text-center">
                <!-- View -->
                <a th:href="@{'/bills/' + ${bill.id}}" class="btn btn-sm btn-primary me-1" title="View Bill">
                  <i class="bi bi-eye"></i>
                </a>

                <!-- Edit -->
                <a th:href="@{'/bills/edit/' + ${bill.id}}" class="btn btn-sm btn-warning me-1" title="Edit Bill">
                  <i class="bi bi-pencil-square"></i>
                </a>

                <!-- PDF -->
                <a th:href="@{'/bills/' + ${bill.id} + '/pdf'}" class="btn btn-sm btn-outline-light me-1" title="Download PDF">
                  <i class="bi bi-file-earmark-pdf"></i>
                </a>

                <!-- Delete -->
                <a th:href="@{'/bills/delete/' + ${bill.id}}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this bill?');" title="Delete Bill">
                  <i class="bi bi-trash"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Back Button -->
      <a th:href="@{/}" class="btn btn-outline-light mt-3">
        <i class="bi bi-house-door me-1"></i> Back to Dashboard
      </a>
    </div>
  </main>

  <!-- ✅ Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const sidebar = document.querySelector('.sidebar');
    const toggleBtn = document.getElementById('sidebarToggle');
    const body = document.body;

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('active');
      body.classList.toggle('sidebar-open');
    });
  </script>
</body>
</html>
