<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Management System | Bills</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f4f7f9;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden; /* only hide horizontal scroll, keep vertical scroll */
    }

    /* Sidebar layout */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
      background-color: #1a237e;
      color: #fff;
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    /* Main content beside sidebar */
    .main-content {
      flex-grow: 1;
      margin-left: 260px;
      padding: 30px;
      transition: margin-left 0.3s ease;
    }

    /* Card styling */
    .card {
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
      background-color: #fff;
      margin-bottom: 30px;
      padding: 25px;
    }

    .card h2 {
      color: #1565c0;
      margin-bottom: 20px;
      font-weight: 600;
    }

    /* Save button styling */
    .btn-save {
      background-color: #1565c0;
      color: #fff;
      border-radius: 30px;
      padding: 10px 20px;
      transition: 0.3s ease;
    }

    .btn-save:hover {
      background-color: #0d47a1;
    }

    /* Table styling */
    .table thead th {
      background-color: #1565c0;
      color: #fff;
      text-align: center;
    }

    .table tbody td {
      text-align: center;
      vertical-align: middle;
    }

    .badge {
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Mobile sidebar toggle button */
    .toggle-btn {
      display: none;
      background: none;
      border: none;
      font-size: 28px;
      color: #1565c0;
      margin-bottom: 20px;
    }

    /* Responsive layout */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .toggle-btn {
        display: inline-block;
      }
    }
  </style>
</head>

<body>
  <!-- Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Mobile toggle button -->
    <button class="toggle-btn" onclick="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>

    <h1 class="text-primary mb-4">Manage Bills</h1>

    <!-- Add Bill Form -->
    <div class="card">
      <h2>Add New Bill</h2>
      <form th:action="@{/bills}" method="post" class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Amount</label>
          <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" required/>
        </div>
        <div class="col-md-3">
          <label class="form-label">Status</label>
          <select name="status" class="form-select">
            <option value="UNPAID">UNPAID</option>
            <option value="PAID">PAID</option>
            <option value="PENDING">PENDING</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Patient ID</label>
          <input type="number" name="patientId" class="form-control" required/>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button type="submit" class="btn-save w-100">Save Bill</button>
        </div>
      </form>
    </div>

    <!-- Bills Table -->
    <div class="card">
      <h2>All Bills</h2>
      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Date</th>
              <th>Patient</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="bill : ${bills}">
              <td th:text="${bill.id}"></td>
              <td th:text="'₹' + ${#numbers.formatDecimal(bill.amount, 1, 'COMMA', 2, 'POINT')}"></td>
              <td>
                <span th:classappend="${bill.status == 'PAID' ? 'badge bg-success' : (bill.status == 'UNPAID' ? 'badge bg-danger' : 'badge bg-warning')}"
                      th:text="${bill.status}"></span>
              </td>
              <td th:text="${#temporals.format(bill.billDate, 'dd-MMM-yyyy')}"></td>
              <td th:text="${bill.patient.name}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      sidebar.classList.toggle('active');
    }
  </script>
</body>
</html>
