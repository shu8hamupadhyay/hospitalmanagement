<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Management System | Bills</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>

  <style>
    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: #f4f7f9;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background-color: #1e88e5;
      color: #fff;
      padding: 20px;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 30px;
    }

    .nav-link {
      color: #e3f2fd;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      border-radius: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }

    .nav-link:hover, .nav-link.active {
      background-color: #1565c0;
      color: #fff;
    }

    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 30px;
    }

    .card {
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
      background-color: #fff;
      margin-bottom: 30px;
      padding: 25px;
    }

    .card h2 {
      color: #1565c0;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .btn-save {
      background-color: #1565c0;
      color: #fff;
      border-radius: 30px;
      padding: 10px 20px;
      transition: 0.3s ease;
    }

    .btn-save:hover {
      background-color: #0d47a1;
    }

    .table thead th {
      background-color: #1565c0;
      color: #fff;
      text-align: center;
    }

    .table tbody td {
      text-align: center;
      vertical-align: middle;
    }

    .badge {
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      body {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>🏥 HMS Admin</h2>
    <nav class="nav flex-column">
      <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a class="nav-link" th:href="@{/doctors}"><i class="bi bi-person-badge"></i> Doctors</a>
      <a class="nav-link" th:href="@{/patients}"><i class="bi bi-people"></i> Patients</a>
      <a class="nav-link" th:href="@{/appointments}"><i class="bi bi-calendar-event"></i> Appointments</a>
      <a class="nav-link active" th:href="@{/bills}"><i class="bi bi-cash-coin"></i> Bills</a>
      <a class="nav-link" th:href="@{/prescriptions}"><i class="bi bi-capsule"></i> Prescriptions</a>
      <a class="nav-link" th:href="@{/labreports}"><i class="bi bi-beaker"></i> Lab Reports</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <h1 class="text-primary mb-4">Manage Bills</h1>

    <!-- Add Bill Form -->
    <div class="card">
      <h2>Add New Bill</h2>
      <form th:action="@{/bills}" method="post" class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Amount</label>
          <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" required/>
        </div>
        <div class="col-md-3">
          <label class="form-label">Status</label>
          <select name="status" class="form-select">
            <option value="UNPAID">UNPAID</option>
            <option value="PAID">PAID</option>
            <option value="PENDING">PENDING</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Patient ID</label>
          <input type="number" name="patientId" class="form-control" required/>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button type="submit" class="btn-save w-100">Save Bill</button>
        </div>
      </form>
    </div>

    <!-- Bills Table -->
    <div class="card">
      <h2>All Bills</h2>
      <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Date</th>
              <th>Patient</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="bill : ${bills}">
              <td th:text="${bill.id}"></td>
              <td th:text="'₹' + ${#numbers.formatDecimal(bill.amount, 1, 'COMMA', 2, 'POINT')}"></td>
              <td>
                <span th:classappend="${bill.status == 'PAID' ? 'badge bg-success' : (bill.status == 'UNPAID' ? 'badge bg-danger' : 'badge bg-warning')}"
                      th:text="${bill.status}"></span>
              </td>
              <td th:text="${#temporals.format(bill.billDate, 'dd-MMM-yyyy')}"></td>
              <td th:text="${bill.patient.name}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
