<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${department.id != null ? 'Edit Department' : 'Add New Department'}">Add Department</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Shared Sidebar CSS -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #121212;
      color: #f1f1f1;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ✅ Flex wrapper for sidebar and main content */
    .layout-container {
      display: flex;
      min-height: 100vh;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* 🧭 Sidebar from fragment */
    .sidebar {
      width: 250px;
      background-color: #1e1e1e;
      border-right: 1px solid #2a2a2a;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    /* 🧭 Main Content */
    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 40px;
      background-color: #181818;
      transition: all 0.3s ease;
    }

    /* 🧾 Card & Form Styling */
    .card {
      background-color: #212121;
      border: 1px solid #2c2c2c;
      color: #fff;
      border-radius: 10px;
    }

    .form-control,
    .form-select {
      background-color: #2b2b2b;
      color: #fff;
      border: 1px solid #3a3a3a;
    }

    .form-control::placeholder {
      color: #9e9e9e;
    }

    .form-control:focus,
    .form-select:focus {
      background-color: #2b2b2b;
      border-color: #00bcd4;
      box-shadow: 0 0 0 0.2rem rgba(0, 188, 212, 0.25);
    }

    .btn {
      border-radius: 30px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-success {
      background-color: #00bcd4;
      border-color: #00bcd4;
    }

    .btn-success:hover {
      background-color: #0097a7;
    }

    .btn-secondary {
      background-color: #424242;
      border-color: #424242;
    }

    .btn-secondary:hover {
      background-color: #616161;
    }

    /* 🍔 Mobile Toggle */
    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: #00bcd4;
      font-size: 1.8rem;
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1100;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    /* 📱 Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        height: 100%;
        z-index: 1000;
      }

      .sidebar.active {
        left: 0;
      }

      .main-content {
        padding: 20px;
      }

      .mobile-toggle {
        display: block;
      }

      body.sidebar-open {
        overflow: hidden;
      }
    }
  </style>
</head>

<body>

  <!-- 🍔 Mobile Sidebar Toggle -->
  <button class="mobile-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <!-- 🌫 Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ✅ Proper layout wrapper -->
  <div class="layout-container">

    <!-- 🧭 Sidebar Fragment -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <!-- 🧾 Main Content -->
    <main class="main-content">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 th:text="${department.id != null ? 'Edit Department' : 'Add New Department'}">Add Department</h2>
          <a th:href="@{/departments}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to Departments
          </a>
        </div>

        <div class="card shadow p-4">
          <form th:action="@{/departments/save}" th:object="${department}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
              <label class="form-label">Department Name</label>
              <input type="text" th:field="*{name}" class="form-control" placeholder="Enter department name" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Head of Department</label>
              <input type="text" th:field="*{head}" class="form-control" placeholder="Dr. John Doe" required />
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Staff Count</label>
                <input type="number" th:field="*{staffCount}" class="form-control" required />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Services Offered</label>
                <input type="text" th:field="*{servicesOffered}" class="form-control" required />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Status</label>
              <select th:field="*{status}" class="form-select">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>

            <div class="d-flex justify-content-end gap-3">
              <a th:href="@{/departments}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Back
              </a>
              <button type="submit" class="btn btn-success">
                <i class="bi bi-save"></i> Save Department
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

  </div> <!-- End layout-container -->

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Sidebar Toggle Script -->
  <script>
    const toggleBtn = document.getElementById("sidebarToggle");
    const sidebar = document.querySelector(".sidebar");
    const overlay = document.getElementById("sidebarOverlay");

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("active");
      overlay.classList.toggle("active");
      document.body.classList.toggle("sidebar-open");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
      document.body.classList.remove("sidebar-open");
    });
  </script>
</body>
</html>
