<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>HMS Admin | Edit Lab Report</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    /* --- Global Body --- */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* --- Main Content --- */
    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      background-color: #0d1117;
      padding: 30px;
      transition: margin-left 0.3s ease-in-out;
    }

    /* Section Title */
    h2 {
      color: #58a6ff;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* Card Styling */
    .card {
      background-color: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(56, 139, 253, 0.05);
      max-width: 700px;
      margin: 0 auto;
      padding: 25px;
    }

    /* Form Controls */
    .form-control, .form-select, textarea {
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
    }

    .form-control::placeholder,
    .form-select option {
      color: #9ba6b2;
    }

    .form-control:focus, .form-select:focus {
      border-color: #58a6ff;
      box-shadow: none;
      background-color: #0d1117;
    }

    label {
      font-weight: 500;
      color: #e6edf3;
    }

    /* Buttons */
    .btn {
      border-radius: 8px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-success {
      background-color: #238636;
      border-color: #238636;
      color: #fff;
    }

    .btn-success:hover {
      background-color: #2ea043;
      border-color: #2ea043;
    }

    .btn-secondary {
      background-color: #30363d;
      border: none;
      color: #fff;
    }

    .btn-secondary:hover {
      background-color: #484f58;
    }

    .btn-outline-light {
      border-color: #444c56;
      color: #e6edf3;
    }

    .btn-outline-light:hover {
      background-color: #30363d;
      color: #fff;
    }

    /* Responsive Fix */
    @media (max-width: 768px) {
      .main-content {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="d-flex align-items-center mb-4">
      <button class="toggle-btn d-md-none me-3" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>
      <a href="/labreports" class="btn btn-outline-light btn-sm me-3">
        <i class="bi bi-arrow-left"></i> Back
      </a>
      <h2><i class="bi bi-journal-medical me-2"></i>Edit Lab Report</h2>
    </div>

    <div class="card">
      <form th:action="@{'/labreports/update/' + ${report.id}}" method="post" th:object="${report}">
        <div class="mb-3">
          <label for="testName" class="form-label">Test Name</label>
          <input type="text" id="testName" th:field="*{testName}" class="form-control" placeholder="Enter test name" required>
        </div>

        <div class="mb-3">
          <label for="result" class="form-label">Result</label>
          <textarea id="result" th:field="*{result}" class="form-control" rows="3" placeholder="Enter detailed findings..." required></textarea>
        </div>

        <div class="mb-3">
          <label for="notes" class="form-label">Notes</label>
          <textarea id="notes" th:field="*{notes}" class="form-control" rows="2" placeholder="Add any notes..."></textarea>
        </div>

        <div class="mb-4">
          <label for="patientId" class="form-label">Patient</label>
          <select id="patientId" name="patientId" class="form-select" required>
            <option th:each="p : ${patients}"
                    th:value="${p.id}"
                    th:text="${p.name}"
                    th:selected="${p.id} == ${report.patient.id}">
            </option>
          </select>
        </div>

        <div class="d-flex justify-content-between pt-3">
          <a href="/labreports" class="btn btn-secondary">
            <i class="bi bi-x-circle"></i> Cancel
          </a>
          <button type="submit" class="btn btn-success">
            <i class="bi bi-check-circle"></i> Update Report
          </button>
        </div>
      </form>
    </div>
  </main>

  <script>
    function toggleSidebar() {
      document.querySelector('.sidebar').classList.toggle('active');
      document.body.classList.toggle('sidebar-open');
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
