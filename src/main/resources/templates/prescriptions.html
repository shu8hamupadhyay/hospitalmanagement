<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prescriptions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body { display: flex; height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #f4f7f9; }
    .sidebar { width: 250px; background-color: #1e88e5; color: #fff; padding: 20px; flex-shrink: 0; }
    .sidebar h2 { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 30px; }
    .nav-link { color: #e3f2fd; display: flex; align-items: center; gap: 10px; padding: 10px 15px; border-radius: 8px; transition: all 0.2s; text-decoration: none; }
    .nav-link:hover, .nav-link.active { background-color: #1565c0; color: #fff; }
    .main-content { flex-grow: 1; overflow-y: auto; padding: 30px; }
    @media (max-width: 768px) { .sidebar { display: none; } body { flex-direction: column; } }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <h2>🏥 HMS Admin</h2>
  <nav class="nav flex-column">
    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a class="nav-link" th:href="@{/doctors}"><i class="bi bi-person-badge"></i> Doctors</a>
    <a class="nav-link" th:href="@{/patients}"><i class="bi bi-people"></i> Patients</a>
    <a class="nav-link" th:href="@{/appointments}"><i class="bi bi-calendar-event"></i> Appointments</a>
    <a class="nav-link" th:href="@{/bills}"><i class="bi bi-cash-coin"></i> Bills</a>
    <a class="nav-link active" th:href="@{/prescriptions}"><i class="bi bi-capsule"></i> Prescriptions</a>
    <a class="nav-link" th:href="@{/labreports}"><i class="bi bi-beaker"></i> Lab Reports</a>
  </nav>
</aside>

<!-- Main Content -->
<main class="main-content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="text-primary">Prescriptions</h1>
    <a th:href="@{/prescriptions/form}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Add Prescription</a>
  </div>

  <table class="table table-striped table-bordered">
    <thead class="table-primary">
      <tr>
        <th>ID</th>
        <th>Medicine</th>
        <th>Dosage</th>
        <th>Patient</th>
        <th>Doctor</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="p : ${prescriptions}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.medicine}"></td>
        <td th:text="${p.dosage}"></td>
        <td th:text="${p.patient.name}"></td>
        <td th:text="${p.doctor.name}"></td>
        <td th:text="${#temporals.format(p.date, 'dd-MM-yyyy HH:mm')}"></td>
        <td>
          <a th:href="@{/prescriptions/form(id=${p.id})}" class="btn btn-warning btn-sm"><i class="bi bi-pencil"></i></a>
          <a th:href="@{/prescriptions/delete/{id}(id=${p.id})}" class="btn btn-danger btn-sm" 
             onclick="return confirm('Are you sure you want to delete this prescription?')">
             <i class="bi bi-trash"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
