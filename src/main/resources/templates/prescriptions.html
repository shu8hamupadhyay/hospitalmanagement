<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prescriptions | HMS</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f4f7f9;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden; /* allow vertical scroll, prevent horizontal */
    }

    .nav-link {
      color: #e3f2fd;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      background-color: #1565c0;
      color: #fff;
    }

    /* Main content beside sidebar */
    .main-content {
      flex-grow: 1;
      margin-left: 260px;
      padding: 30px;
      transition: margin-left 0.3s ease;
    }

    /* Table styling */
    .table thead th {
      background-color: #1565c0;
      color: #fff;
      text-align: center;
    }

    .table tbody td {
      text-align: center;
      vertical-align: middle;
    }

    /* Mobile sidebar toggle */
    .toggle-btn {
      display: none;
      background: none;
      border: none;
      font-size: 28px;
      color: #1565c0;
      margin-bottom: 20px;
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .toggle-btn {
        display: inline-block;
      }
    }
  </style>
</head>

<body>
  <!-- Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Mobile toggle -->
    <button class="toggle-btn" onclick="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="text-primary">Prescriptions</h1>
      <a th:href="@{/prescriptions/form}" class="btn btn-success">
        <i class="bi bi-plus-circle"></i> Add Prescription
      </a>
    </div>

    <div class="card p-3 shadow-sm rounded-4 bg-white">
      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Medicine</th>
              <th>Dosage</th>
              <th>Patient</th>
              <th>Doctor</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${prescriptions}">
              <td th:text="${p.id}"></td>
              <td th:text="${p.medicine}"></td>
              <td th:text="${p.dosage}"></td>
              <td th:text="${p.patient.name}"></td>
              <td th:text="${p.doctor.name}"></td>
              <td th:text="${#temporals.format(p.date, 'dd-MM-yyyy HH:mm')}"></td>
              <td>
                <a th:href="@{/prescriptions/form(id=${p.id})}" class="btn btn-warning btn-sm">
                  <i class="bi bi-pencil"></i>
                </a>
                <a th:href="@{/prescriptions/delete/{id}(id=${p.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this prescription?')">
                  <i class="bi bi-trash"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      sidebar.classList.toggle('active');
    }
  </script>
</body>
</html>
