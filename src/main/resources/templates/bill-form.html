<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${bill.id != null} ? 'Edit Bill' : 'Create Bill'">HMS Admin | Bill</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/css/sidebar.css}" rel="stylesheet"/>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 30px;
      background-color: #0d1117;
      margin-left: 260px;
      transition: margin-left 0.3s ease;
    }

    .toggle-btn {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      background: none;
      border: none;
      color: #fff;
      font-size: 26px;
      z-index: 1100;
      cursor: pointer;
    }

    .section-title {
      color: #3fb950;
      font-weight: 700;
      margin-bottom: 25px;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-section {
      background-color: #161b22;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 0 15px rgba(56, 139, 253, 0.05);
    }

    .card-section h5 {
      color: #58a6ff;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .form-control,
    .form-select {
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #58a6ff;
      box-shadow: none;
    }

    .btn {
      border-radius: 8px;
      font-weight: 500;
    }

    .btn-success { background-color: #238636; border: none; }
    .btn-success:hover { background-color: #2ea043; }

    .btn-outline-light { border-color: #c9d1d9; color: #c9d1d9; }
    .btn-outline-light:hover { background-color: #c9d1d9; color: #0d1117; }

    .btn-danger { background-color: #f85149; border: none; }
    .btn-danger:hover { background-color: #da3633; }

    .table { color: #c9d1d9; border-color: #30363d; }
    .table thead th {
      background-color: #1e2631;
      color: #58a6ff;
      text-align: center;
    }
    .table tbody td {
      text-align: center;
      vertical-align: middle;
    }
    .table tbody tr:hover { background-color: #21262d; }

    .totals { line-height: 1.8; }
    .totals strong { color: #3fb950; }

    @media (max-width: 768px) {
      .sidebar { left: -270px; }
      .sidebar.active { left: 0; }
      .toggle-btn { display: block; }
      .main-content { margin-left: 0; padding-top: 70px; }
      body.sidebar-open { overflow: hidden; }
      .table-responsive { overflow-x: auto; }
    }
  </style>
</head>

<body>
  <!-- ☰ Sidebar Toggle -->
  <button class="toggle-btn" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <!-- ✅ Sidebar -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- ✅ Main Content -->
  <main class="main-content">
    <h2 class="section-title">
      <i class="bi bi-receipt"></i>
      <span th:text="${bill.id != null} ? 'Edit Bill' : 'Create New Bill'"></span>
    </h2>

    <form th:action="@{/bills}" th:object="${bill}" method="post">
      <!-- Hidden ID (for edit mode) -->
      <input type="hidden" th:if="${bill.id != null}" th:field="*{id}"/>

      <!-- Patient & Doctor -->
      <div class="card-section">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Patient</label>
            <select class="form-select" th:field="*{patient.id}" required>
              <option value="">-- Select Patient --</option>
              <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"></option>
            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Doctor</label>
            <select class="form-select" th:field="*{doctor.id}" required>
              <option value="">-- Select Doctor --</option>
              <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name}"></option>
            </select>
          </div>
        </div>
      </div>

      <!-- Bill Items -->
      <div class="card-section">
        <h5><i class="bi bi-list-ul me-2"></i> Bill Items</h5>
        <div class="table-responsive">
          <table class="table table-bordered align-middle" id="itemsTable">
            <thead>
              <tr>
                <th>Description</th>
                <th>Qty</th>
                <th>Unit Price</th>
                <th>Tax %</th>
                <th>Discount %</th>
                <th>Subtotal</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="itemBody">
              <!-- Existing items (edit mode) -->
              <tr th:each="item, iter : ${bill.items}">
                <td><input type="text" th:field="*{items[__${iter.index}__].description}" class="form-control" required></td>
                <td><input type="number" th:field="*{items[__${iter.index}__].quantity}" class="form-control qty" min="1" required></td>
                <td><input type="number" th:field="*{items[__${iter.index}__].unitPrice}" class="form-control price" step="0.01" required></td>
                <td><input type="number" th:field="*{items[__${iter.index}__].taxPercent}" class="form-control tax" step="0.01" required></td>
                <td><input type="number" th:field="*{items[__${iter.index}__].discountPercent}" class="form-control discount" step="0.01" required></td>
                <td><input type="text" th:field="*{items[__${iter.index}__].subTotal}" class="form-control subtotal" readonly></td>
                <td><button type="button" class="btn btn-danger btn-sm" onclick="removeItem(this)"><i class="bi bi-x-lg"></i></button></td>
              </tr>
            </tbody>
          </table>
        </div>

        <button type="button" class="btn btn-secondary mt-2" onclick="addItem()">
          <i class="bi bi-plus-circle"></i> Add Item
        </button>
      </div>

      <!-- Totals -->
      <div class="card-section">
        <h5><i class="bi bi-calculator me-2"></i> Totals</h5>
        <div class="totals">
          <div>Total Before Tax: ₹<span id="totalBeforeTax">0.00</span></div>
          <div>Total Discount: ₹<span id="totalDiscount">0.00</span></div>
          <div>Total Tax: ₹<span id="totalTax">0.00</span></div>
          <div><strong>Grand Total: ₹<span id="grandTotal">0.00</span></strong></div>
        </div>
      </div>

      <!-- Submit Buttons -->
      <div class="text-end mt-3">
        <a th:href="@{/bills}" class="btn btn-outline-light me-2">
          <i class="bi bi-arrow-left"></i> Back to Bills
        </a>
        <button type="submit" class="btn btn-success px-4">
          <i class="bi bi-save"></i> Save Bill
        </button>
      </div>
    </form>
  </main>

  <!-- ✅ Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const sidebar = document.querySelector('.sidebar');
    const toggleBtn = document.getElementById('sidebarToggle');
    const body = document.body;

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('active');
      body.classList.toggle('sidebar-open');
    });

    // --- Bill Item Functions ---
    function addItem() {
      const tbody = document.getElementById('itemBody');
      const index = tbody.children.length;
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><input type="text" name="items[${index}].description" class="form-control" required></td>
        <td><input type="number" name="items[${index}].quantity" class="form-control qty" value="1" min="1" required></td>
        <td><input type="number" name="items[${index}].unitPrice" class="form-control price" value="0" step="0.01" required></td>
        <td><input type="number" name="items[${index}].taxPercent" class="form-control tax" value="0" step="0.01" required></td>
        <td><input type="number" name="items[${index}].discountPercent" class="form-control discount" value="0" step="0.01" required></td>
        <td><input type="text" name="items[${index}].subTotal" class="form-control subtotal" readonly></td>
        <td><button type="button" class="btn btn-danger btn-sm" onclick="removeItem(this)"><i class="bi bi-x-lg"></i></button></td>
      `;
      tbody.appendChild(row);
      row.querySelectorAll('input').forEach(i => i.addEventListener('input', updateTotals));
      updateTotals();
    }

    function removeItem(btn) {
      btn.closest('tr').remove();
      reindexItems();
      updateTotals();
    }

    function reindexItems() {
      document.querySelectorAll('#itemBody tr').forEach((row, i) => {
        row.querySelectorAll('input').forEach(input => {
          input.name = input.name.replace(/\[\d+\]/, `[${i}]`);
        });
      });
    }

    function updateTotals() {
      let totalBefore = 0, totalTax = 0, totalDiscount = 0;

      document.querySelectorAll('#itemBody tr').forEach(row => {
        const qty = parseFloat(row.querySelector('.qty').value) || 0;
        const price = parseFloat(row.querySelector('.price').value) || 0;
        const tax = parseFloat(row.querySelector('.tax').value) || 0;
        const disc = parseFloat(row.querySelector('.discount').value) || 0;

        const base = qty * price;
        const discountAmt = base * (disc / 100);
        const afterDisc = base - discountAmt;
        const taxAmt = afterDisc * (tax / 100);
        const subtotal = afterDisc + taxAmt;

        totalBefore += base;
        totalDiscount += discountAmt;
        totalTax += taxAmt;

        row.querySelector('.subtotal').value = subtotal.toFixed(2);
      });

      const grand = totalBefore - totalDiscount + totalTax;
      document.getElementById('totalBeforeTax').textContent = totalBefore.toFixed(2);
      document.getElementById('totalDiscount').textContent = totalDiscount.toFixed(2);
      document.getElementById('totalTax').textContent = totalTax.toFixed(2);
      document.getElementById('grandTotal').textContent = grand.toFixed(2);
    }
  </script>
</body>
</html>
