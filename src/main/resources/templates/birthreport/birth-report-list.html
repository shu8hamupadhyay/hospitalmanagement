<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birth Reports</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />

  <style>
    :root {
      --bg-main: #0d1117;
      --bg-sidebar: #161b22;
      --bg-card: #1c2128;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --hover-green: #238636;
      --shadow-soft: rgba(56, 139, 253, 0.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }


    .nav-link {
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .nav-link:hover {
      background-color: var(--hover-green);
      color: #fff;
      transform: translateX(4px);
    }

    .nav-link.active {
      background: linear-gradient(90deg, var(--hover-green), var(--accent-green));
      color: #fff;
    }

    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 40px;
      background-color: var(--bg-main);
    }

    .main-content h2 {
      color: var(--accent-blue);
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 0 15px var(--shadow-soft);
      padding: 25px;
      color: var(--text-primary);
    }

    .table {
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .table thead {
      background-color: #21262d;
      color: var(--accent-blue);
    }

    .table tbody tr:hover {
      background-color: #161b22;
    }

    .btn-add {
      background-color: var(--hover-green);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .btn-add:hover {
      background-color: var(--accent-green);
    }

    a.view-link {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
    }

    a.view-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      body {
        flex-direction: column;
      }
      .main-content {
        padding: 20px;
      }
    }
  </style>
</head>

<body>


  <!-- Sidebar Toggle Button -->
  <button class="toggle-btn" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <!-- Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>



  <!-- Main Content -->
  <main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold">👶 Birth Reports</h2>
      <a href="/birth-reports/add" class="btn btn-add">
        <i class="bi bi-plus-circle"></i> Add New Birth Report
      </a>
    </div>

    <div class="card">
      <table class="table table-bordered table-hover align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Baby Name</th>
            <th>Mother</th>
            <th>Gender</th>
            <th>Birth Date</th>
            <th>Doctor</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="report : ${birthReports}">
            <td th:text="${report.id}">1</td>
            <td th:text="${report.babyName}">Baby A</td>
            <td th:text="${report.motherName}">Mrs. Sharma</td>
            <td th:text="${report.gender}">Female</td>
            <td th:text="${#temporals.format(report.birthDateTime, 'dd MMM yyyy HH:mm')}">01 Nov 2025 10:30</td>
            <td th:text="${report.doctorName}">Dr. Mehta</td>
            <td>
              <a th:href="@{'/birth-reports/view/' + ${report.id}}" class="view-link">
                <i class="bi bi-eye"></i> View
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
