<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>

<body>
  <!-- 🌙 Sidebar Fragment -->
  <aside th:fragment="sidebar" class="sidebar">
    <div class="sidebar-header d-flex justify-content-between align-items-center">
      <h2>Hospital Management</h2>
      <button class="toggle-btn d-md-none" id="sidebarToggle">
        <i class="bi bi-list"></i>
      </button>
    </div>

    <nav class="nav flex-column mt-3">
      <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
      <a class="nav-link" th:href="@{/doctors}"><i class="bi bi-person-badge me-2"></i> Doctors</a>
      <a class="nav-link" th:href="@{/patients}"><i class="bi bi-people me-2"></i> Patients</a>
      <a class="nav-link" th:href="@{/appointments}"><i class="bi bi-calendar-event me-2"></i> Appointments</a>
      <a class="nav-link" th:href="@{/bills}"><i class="bi bi-cash-coin me-2"></i> Bills</a>
      <a class="nav-link" th:href="@{/prescriptions}"><i class="bi bi-capsule me-2"></i> Prescriptions</a>
<a class="nav-link" th:href="@{/labreports}">
  <i class="bi bi-clipboard2-pulse me-2"></i> Lab Reports
</a>
      <a class="nav-link" th:href="@{/rooms}"><i class="bi bi-door-open me-2"></i> Room Allotment</a>
      <a class="nav-link" th:href="@{/pharmacy}"><i class="bi bi-prescription2 me-2"></i> Pharmacy</a>
      <a class="nav-link" th:href="@{/departments}"><i class="bi bi-building me-2"></i> Departments</a>
      <a class="nav-link" th:href="@{/contacts}"><i class="bi bi-envelope me-2"></i> Contacts</a>
      <a class="nav-link" th:href="@{/birth-reports}"><i class="bi bi-heart me-2"></i> Birth Reports</a>
      <a class="nav-link" th:href="@{/death-reports}"><i class="bi bi-heartbreak me-2"></i> Death Reports</a>
    </nav>
  </aside>

  <!-- Overlay for Mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script>
    // Sidebar Toggle Logic
    document.addEventListener('DOMContentLoaded', function () {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const toggleBtn = document.getElementById('sidebarToggle');

      toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');
      });

      overlay.addEventListener('click', () => {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
      });
    });
  </script>
</body>
</html>
