<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏥 HMS | Appointments</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Sidebar CSS -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    :root {
      --bg-main: #0d1117;
      --bg-card: #1c2128;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-yellow: #d29922;
      --accent-red: #f85149;
      --shadow-soft: rgba(56, 139, 253, 0.1);
      --shadow-strong: rgba(88, 166, 255, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      overflow: hidden;
    }

    .page-wrapper {
      display: flex;
      flex: 1;
      height: 100vh;
      overflow: hidden;
    }

    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 40px;
      margin-left: 260px;
      background-color: var(--bg-main);
      transition: margin-left 0.3s ease;
    }

    /* --- Topbar --- */
    .topbar {
      background-color: var(--bg-card);
      padding: 15px 25px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-radius: 12px;
      box-shadow: 0 0 15px var(--shadow-soft);
      transition: all 0.3s ease;
    }

    .topbar:hover {
      box-shadow: 0 0 20px var(--shadow-strong);
      transform: translateY(-2px);
    }

    .topbar h1 {
      color: var(--accent-blue);
      font-weight: 700;
      margin: 0;
      font-size: 1.7rem;
    }

    /* --- Cards --- */
    .card {
      border: 1px solid var(--border-color);
      border-radius: 14px;
      background-color: var(--bg-card);
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 0 15px var(--shadow-soft);
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 25px var(--shadow-strong);
    }

    .card-header {
      background-color: #161b22;
      border-bottom: 1px solid var(--border-color);
      color: var(--accent-blue);
      font-weight: 600;
      border-radius: 10px 10px 0 0;
      padding: 12px 18px;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }

    /* --- Form Fields --- */
    .form-label {
      color: var(--text-secondary);
      font-weight: 600;
    }

    .form-control,
    .form-select {
      background-color: #161b22;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 8px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 5px var(--accent-blue);
    }

    /* --- Buttons --- */
    .btn-primary {
      background-color: var(--accent-blue);
      border: none;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.3);
    }

    .btn-primary:hover {
      background-color: #1f6feb;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(88, 166, 255, 0.5);
    }

    /* --- Table --- */
    table {
      color: var(--text-primary);
      border-color: var(--border-color);
      transition: all 0.2s ease;
    }

    table thead {
      background-color: #21262d;
      color: var(--accent-blue);
    }

    table thead th {
      border-color: var(--border-color);
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    table tbody tr {
      transition: all 0.2s ease;
    }

    table tbody tr:hover {
      background-color: #161b22;
      transform: scale(1.01);
      box-shadow: inset 0 0 10px rgba(88, 166, 255, 0.15);
    }

    td {
      vertical-align: middle;
    }

    /* --- Mobile Responsive --- */
    @media (max-width: 768px) {
      .main-content {
        margin-left: 0;
        padding: 20px;
      }

      .topbar {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div class="page-wrapper">
    <!-- Sidebar Fragment -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="topbar">
        <h1><i class="bi bi-calendar-event"></i> Manage Appointments</h1>
      </div>

      <!-- Appointment Form -->
      <div class="card mb-4">
        <div class="card-header">
          <i class="bi bi-calendar-plus me-2"></i> Schedule New Appointment
        </div>
        <div class="card-body">
          <form th:action="@{/appointments}" th:object="${appointment}" method="post">
            <div class="mb-3">
              <label class="form-label">Select Patient</label>
              <select class="form-select" th:field="*{patient}" required>
                <option value="">-- Choose Patient --</option>
                <option th:each="p : ${patients}" th:value="${p.id}"
                  th:text="${p.name + ' (ID: ' + p.id + ')'}"></option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Select Doctor</label>
              <select class="form-select" th:field="*{doctor}" required>
                <option value="">-- Choose Doctor --</option>
                <option th:each="d : ${doctors}" th:value="${d.id}"
                  th:text="${d.name + ' - ' + d.specialization}"></option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Date and Time</label>
              <input type="datetime-local" class="form-control" th:field="*{appointmentDate}" required>
            </div>

            <div class="mb-4">
              <label class="form-label">Status</label>
              <select class="form-select" th:field="*{status}" required>
                <option value="Scheduled">Scheduled</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Pending">Pending</option>
              </select>
            </div>

            <div class="d-flex justify-content-end">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle me-1"></i> Save Appointment
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Appointment Table -->
      <div class="card">
        <div class="card-header">
          <i class="bi bi-list-ul me-2"></i> All Appointments
        </div>
        <div class="card-body">
          <table class="table table-bordered table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Patient</th>
                <th>Doctor</th>
                <th>Date & Time</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="appt : ${appointments}">
                <td th:text="${appt.id}"></td>
                <td th:text="${appt.patient.name}"></td>
                <td th:text="${appt.doctor.name + ' - ' + appt.doctor.specialization}"></td>
                <td th:text="${#temporals.format(appt.appointmentDate, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${appt.status}"></td>
              </tr>
              <tr th:if="${appointments.size() == 0}">
                <td colspan="5" class="text-center" style="color: var(--text-secondary);">
                  No appointments scheduled yet.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
