<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Death Reports</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />

  <style>
    :root {
      --bg-main: #0d1117;
      --bg-sidebar: #161b22;
      --bg-card: #1c2128;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --hover-green: #238636;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }.nav-link { color: var(--text-primary); display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; font-weight: 500; transition: all 0.25s ease; }
    .nav-link:hover { background-color: var(--hover-green); color: #fff; transform: translateX(4px); }
    .nav-link.active { background: linear-gradient(90deg, var(--hover-green), var(--accent-green)); color: #fff; }
    .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; }
    .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; color: var(--text-primary); }
    a.btn-ghost { background: transparent; border: 1px solid var(--border-color); color: var(--accent-blue); border-radius: 8px; padding: 8px 12px; text-decoration: none; }
    table thead th { color: var(--text-secondary); border-bottom: 1px solid var(--border-color); }
    @media (max-width: 768px) { .sidebar { display:none; } body { flex-direction: column; } .main-content { padding: 20px; } }
  </style>
</head>
<body>
  
      <!-- Sidebar Toggle Button -->
  <button class="toggle-btn" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <!-- Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>



  <main class="main-content">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h2 class="fw-bold" style="color: var(--accent-blue)">Death Reports</h2>
      <div>
        <a class="btn btn-sm" th:href="@{/death-reports/add}" style="background:var(--hover-green); color:#fff; border-radius:8px;">
          <i class="bi bi-plus-lg"></i> Add Death Report
        </a>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-borderless mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Patient Name</th>
              <th>Gender</th>
              <th>Cause</th>
              <th>Doctor</th>
              <th>Ward</th>
              <th>Date of Death</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r : ${reports}">
              <td th:text="${r.id}">1</td>
              <td th:text="${r.patientName}">John Doe</td>
              <td th:text="${r.gender}">Male</td>
              <td th:text="${r.causeOfDeath}">Cause</td>
              <td th:text="${r.doctorName}">Dr. X</td>
              <td th:text="${r.ward}">Ward A</td>
              <td th:text="${#temporals.format(r.dateOfDeath,'yyyy-MM-dd HH:mm')}">2025-10-01 12:00</td>
              <td>
                <a th:href="@{/death-reports/{id}(id=${r.id})}" class="btn btn-sm" style="border-radius:8px; margin-right:6px; background:transparent; border:1px solid var(--border-color); color:var(--accent-blue);">
                  <i class="bi bi-eye"></i> View
                </a>
                <a th:href="@{/death-reports/delete/{id}(id=${r.id})}" class="btn btn-sm" style="border-radius:8px; margin-right:6px; background:transparent; border:1px solid #6b0000; color:#ff8b8b;">
                  <i class="bi bi-trash"></i> Delete
                </a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(reports)}">
              <td colspan="8" class="text-center" style="color:var(--text-secondary); padding:24px;">No death reports found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
