<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>View Death Report</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />

  <style>
    :root { --bg-main:#0d1117; --bg-sidebar:#161b22; --bg-card:#1c2128; --border-color:#30363d; --text-primary:#e6edf3; --text-secondary:#8b949e; --accent-blue:#58a6ff; }
    body { font-family:'Inter',sans-serif; background-color:var(--bg-main); color:var(--text-primary); display:flex; height:100vh; overflow:hidden; }
    .main-content { flex-grow:1; overflow-y:auto; padding:40px; }
    .card { background-color:var(--bg-card); border:1px solid var(--border-color); border-radius:14px; padding:30px; color:var(--text-primary); }
    dt { color:var(--text-secondary); font-weight:600; }
    dd { margin-bottom:16px; color:var(--text-primary); }
    @media (max-width:768px) { .sidebar{display:none;} body{flex-direction:column;} .main-content{padding:20px;} }
  </style>
</head>

<body>

      <!-- Sidebar Toggle Button -->
  <button class="toggle-btn" id="sidebarToggle"><i class="bi bi-list"></i></button>

  <!-- Sidebar Fragment -->
  <div th:replace="fragments/sidebar :: sidebar"></div>



  <main class="main-content">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h2 class="fw-bold" style="color:var(--accent-blue)">Death Report Details</h2>
      <div>
        <a th:href="@{/death-reports}" class="btn btn-sm" style="background:transparent; border:1px solid var(--border-color); color:var(--accent-blue); border-radius:8px;">⬅ Back</a>
      </div>
    </div>

    <div class="card">
      <dl class="row">
        <dt class="col-sm-3">ID</dt>
        <dd class="col-sm-9" th:text="${report.id}">1</dd>

        <dt class="col-sm-3">Patient Name</dt>
        <dd class="col-sm-9" th:text="${report.patientName}">John Doe</dd>

        <dt class="col-sm-3">Gender</dt>
        <dd class="col-sm-9" th:text="${report.gender}">Male</dd>

        <dt class="col-sm-3">Cause of Death</dt>
        <dd class="col-sm-9" th:text="${report.causeOfDeath}">Cause</dd>

        <dt class="col-sm-3">Doctor</dt>
        <dd class="col-sm-9" th:text="${report.doctorName}">Dr. X</dd>

        <dt class="col-sm-3">Ward</dt>
        <dd class="col-sm-9" th:text="${report.ward}">Ward A</dd>

        <dt class="col-sm-3">Date & Time of Death</dt>
        <dd class="col-sm-9" th:text="${#temporals.format(report.dateOfDeath,'yyyy-MM-dd HH:mm')}">2025-10-01 12:00</dd>

        <dt class="col-sm-3">Remarks</dt>
        <dd class="col-sm-9" th:text="${report.remarks}">Remarks here</dd>

        <dt class="col-sm-3">Created At</dt>
        <dd class="col-sm-9" th:text="${#temporals.format(report.createdAt,'yyyy-MM-dd HH:mm')}">2025-10-02 09:00</dd>
      </dl>

      <div class="mt-3">
        <a th:href="@{/death-reports/delete/{id}(id=${report.id})}" class="btn btn-sm" style="background:transparent; border:1px solid #6b0000; color:#ff8b8b; border-radius:8px;">
          <i class="bi bi-trash"></i> Delete
        </a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
