<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏥 HMS Dashboard</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Sidebar CSS -->
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">

  <style>
    :root {
      --bg-main: #0d1117;
      --bg-card: #1c2128;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-yellow: #d29922;
      --accent-red: #f85149;
      --shadow-soft: rgba(56, 139, 253, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      overflow: hidden;
    }

    a { text-decoration: none; }

    /* Main content layout */
    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 40px;
      margin-left: 260px; /* Matches sidebar width */
      background-color: var(--bg-main);
      transition: margin-left 0.3s ease;
    }

    .main-content h2 {
      color: var(--accent-blue);
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    /* Cards */
    .card {
      border: none;
      border-radius: 14px;
      background-color: var(--bg-card);
      padding: 25px;
      margin-bottom: 20px;
      transition: transform 0.3s, box-shadow 0.3s;
      height: 100%;
      box-shadow: 0 0 15px var(--shadow-soft);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px var(--shadow-soft);
    }

    .card h5 {
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card h2 {
      font-weight: 700;
      font-size: 2rem;
      margin-top: 10px;
    }

    .doctor-card h2 { color: var(--accent-blue); }
    .patient-card h2 { color: var(--accent-green); }
    .appointment-card h2 { color: var(--accent-yellow); }
    .revenue-card h2 { color: var(--accent-red); }

    /* Table section */
    .card.table-section {
      border: 1px solid var(--border-color);
    }

    .table {
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .table thead {
      background-color: #21262d;
      color: var(--accent-blue);
    }

    .table tbody tr:hover {
      background-color: #161b22;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        overflow-y: auto;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- Main Content -->
  <main class="main-content">
    <h2 class="fw-bold">Dashboard Overview</h2>

    <div class="row g-4">
      <div class="col-lg-3 col-md-6">
        <div class="card text-center doctor-card">
          <h5>Total Doctors</h5>
          <h2 th:text="${doctorCount}">0</h2>
        </div>
      </div>

      <div class="col-lg-3 col-md-6">
        <div class="card text-center patient-card">
          <h5>Total Patients</h5>
          <h2 th:text="${patientCount}">0</h2>
        </div>
      </div>

      <div class="col-lg-3 col-md-6">
        <div class="card text-center appointment-card">
          <h5>Appointments Today</h5>
          <h2 th:text="${appointmentCount}">0</h2>
        </div>
      </div>

      <div class="col-lg-3 col-md-6">
        <div class="card text-center revenue-card">
          <h5>Total Revenue</h5>
          <h2 th:text="'$' + ${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 2, 'POINT')}">$0.00</h2>
        </div>
      </div>
    </div>

    <div class="card table-section p-4 mt-4">
      <h4 class="mb-3" style="color: var(--accent-blue);">Upcoming Appointments</h4>
      <table class="table table-bordered table-hover align-middle">
        <thead>
          <tr>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="appointment : ${appointments}">
            <td th:text="${appointment.patient.name}">John Doe</td>
            <td th:text="${appointment.doctor.name}">Dr. Smith</td>
            <td th:text="${appointment.date}">2025-10-22</td>
            <td th:text="${appointment.time}">10:00 AM</td>
            <td th:text="${appointment.status}">Confirmed</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
