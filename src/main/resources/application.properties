# ==========================================================
# 🌐 Application Configuration
# ==========================================================
spring.application.name=hospitalmanagement

# ==========================================================
# 🗄️ Database (H2 In-Memory)
# ==========================================================
spring.datasource.url=jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================================
# ⚙️ JPA & Hibernate
# ==========================================================
# 'create-drop' = recreate schema every run (good for dev/testing)
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL queries in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensures schema (tables) are created before data.sql runs
spring.jpa.defer-datasource-initialization=true

# Helps Spring Boot detect correct dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================================================
# 🧰 H2 Console
# ==========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================================
# 🔐 Basic Security (for Local Dev Only)
# ==========================================================
spring.security.user.name=admin
spring.security.user.password=admin123

# ==========================================================
# 🌍 Web & Server Settings
# ==========================================================
server.port=8080

# Proper date-time formatting for Thymeleaf + JPA
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss
spring.mvc.format.time=HH:mm:ss

# ==========================================================
# 🧾 SQL Initialization Order
# ==========================================================
# Makes sure schema.sql (if exists) runs before data.sql
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.sql.init.encoding=UTF-8
